<title>E — Electrical Architecture Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap">
<style>
/* Layout: three-pane engineering workbench — tools left, plan-view vehicle canvas centre, inspector right, status strip below.
   Palette follows the E:DEN foundation neutrals (paper / ink / aluminium) with four layer colours that are always
   paired with a distinct line weight + dash pattern + text label. */
:root{
  --bg:#f4f4f0; --panel:#fbfaf6; --canvas:#ecebe4; --zone:#f6f5ef; --zone-off:#e3e2da;
  --ink:#10110f; --ink-2:#3a3c36; --muted:#5a5e58; --line:#c8cac4; --line-strong:#8b8e85;
  --head:#2b2d28; --head-ink:#faf8f2;
  --accent:#00647f; --accent-soft:rgba(0,100,127,.12);
  --pwr:#b3261e; --gnd:#3a3c36; --can:#0a5ec2; --sig:#7a3a9e;
  --warn:#7a5b00; --warn-bg:#f3e7b3; --danger:#a52d26; --ok:#0d7a34; --ok-bg:#dcefe2;
  --sans:"IBM Plex Sans","Neue Haas Grotesk Text Pro","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:"Space Mono","SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171814; --panel:#1f2018; --canvas:#12130f; --zone:#1a1b16; --zone-off:#0d0e0b;
  --ink:#faf8f2; --ink-2:#d2d4ce; --muted:#a3a69b; --line:#3a3c34; --line-strong:#777b75;
  --head:#c8cac4; --head-ink:#10110f;
  --accent:#6fc3e0; --accent-soft:rgba(111,195,224,.16);
  --pwr:#ef7d74; --gnd:#c8cac4; --can:#6fa8ff; --sig:#c99be6;
  --warn:#edcb3c; --warn-bg:#3a3316; --danger:#e2726a; --ok:#5fb98a; --ok-bg:#1d3326; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171814; --panel:#1f2018; --canvas:#12130f; --zone:#1a1b16; --zone-off:#0d0e0b;
  --ink:#faf8f2; --ink-2:#d2d4ce; --muted:#a3a69b; --line:#3a3c34; --line-strong:#777b75;
  --head:#c8cac4; --head-ink:#10110f;
  --accent:#6fc3e0; --accent-soft:rgba(111,195,224,.16);
  --pwr:#ef7d74; --gnd:#c8cac4; --can:#6fa8ff; --sig:#c99be6;
  --warn:#edcb3c; --warn-bg:#3a3316; --danger:#e2726a; --ok:#5fb98a; --ok-bg:#1d3326; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:13px/1.45 var(--sans);overflow:hidden}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.mono{font-family:var(--mono)}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:268px minmax(0,1fr) 352px;
  grid-template-areas:"top top top" "left main right" "status status status"}

/* top bar */
.top{grid-area:top;display:flex;align-items:center;gap:16px;padding:0 14px;height:50px;border-bottom:1px solid var(--line);background:var(--panel);min-width:0}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.brand .mark{width:30px;height:30px;display:grid;place-items:center;background:var(--ink);color:var(--bg);font:700 17px var(--mono)}
.brand .t1{font-weight:600;font-size:14px;line-height:1.1}
.brand .t2{font:10px var(--mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.tabs{display:flex;gap:2px;overflow-x:auto;min-width:0;align-self:stretch}
.tab{border:0;background:none;padding:0 12px;font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tab .n{font-weight:400;background:var(--canvas);padding:0 5px;border-radius:2px}
.tab .n.w{background:var(--warn-bg);color:var(--warn)}
.top .spacer{flex:1}
.top .actions{display:flex;gap:6px;flex:none}
.btn{border:1px solid var(--line-strong);background:var(--panel);padding:4px 9px;font-size:12px;border-radius:2px;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.btn.sm{padding:2px 7px;font-size:11px}
.chip{display:inline-flex;align-items:center;gap:4px;font:10.5px var(--mono);padding:1px 6px;border:1px solid var(--line-strong);border-radius:2px;white-space:nowrap;letter-spacing:.02em}
.chip.ph{border-color:var(--warn);color:var(--warn);background:var(--warn-bg)}
.chip.ok{border-color:var(--ok);color:var(--ok);background:var(--ok-bg)}
.chip.draft{border-style:dashed}
.narrow-only{display:none}

/* side panels */
.left{grid-area:left;border-right:1px solid var(--line);background:var(--panel);overflow:auto;min-height:0}
.right{grid-area:right;border-left:1px solid var(--line);background:var(--panel);overflow:auto;min-height:0}
.sec{padding:12px 14px;border-bottom:1px solid var(--line)}
.eyebrow{font:700 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.eyebrow .lnk{font-weight:400;letter-spacing:.02em;text-transform:none;border:0;background:none;color:var(--accent);padding:0}
.search{position:relative}
.search input{width:100%;padding:6px 8px;border:1px solid var(--line-strong);background:var(--bg);border-radius:2px;font-family:var(--mono);font-size:12px}
.results{margin-top:6px;display:flex;flex-direction:column;border:1px solid var(--line);max-height:260px;overflow:auto}
.results button{display:grid;grid-template-columns:62px 1fr;gap:8px;text-align:left;border:0;border-bottom:1px solid var(--line);background:var(--panel);padding:5px 7px;font-size:12px}
.results button:hover,.results button.act{background:var(--accent-soft)}
.results .k{font:10px var(--mono);color:var(--muted);text-transform:uppercase;padding-top:2px}
.results .empty{padding:6px 8px;color:var(--muted);font-size:12px}

.solo{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--ink);margin-bottom:10px}
.solo button{border:0;border-right:1px solid var(--ink);background:var(--panel);padding:6px 2px;font:700 10px var(--mono);letter-spacing:.04em}
.solo button:last-child{border-right:0}
.solo button:hover{background:var(--accent-soft)}
.solo button.on{background:var(--ink);color:var(--bg)}
.solo-cap{font:10px var(--mono);color:var(--muted);margin:-4px 0 6px;letter-spacing:.06em;text-transform:uppercase}
.layer{display:grid;grid-template-columns:auto 44px 1fr auto;align-items:center;gap:8px;padding:6px 0}
.layer+.layer{border-top:1px dashed var(--line)}
.layer .nm{font-weight:600;font-size:12.5px;letter-spacing:.02em}
.layer .ds{font-size:11px;color:var(--muted)}
.sub{display:flex;gap:12px;padding:2px 0 6px 52px}
.sub label{display:flex;align-items:center;gap:6px;font-size:12px}
.sw{appearance:none;width:30px;height:16px;border:1px solid var(--line-strong);border-radius:8px;background:var(--canvas);position:relative;margin:0;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;background:var(--line-strong);transition:left .12s}
.sw:checked{background:var(--ink);border-color:var(--ink)}
.sw:checked::after{left:16px;background:var(--bg)}
.soloBtn{font:700 9.5px var(--mono);border:1px solid var(--line-strong);background:none;padding:2px 5px;letter-spacing:.06em}
.soloBtn:hover{border-color:var(--ink)}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line-strong)}
.seg button{border:0;background:none;padding:5px;font-size:12px}
.seg button.on{background:var(--ink);color:var(--bg)}
.opt{display:flex;align-items:center;gap:8px;font-size:12px;padding:3px 0}
.zones label{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:3px 0;font-size:12.5px}
.zones .c{font:11px var(--mono);color:var(--muted)}
.legend{display:grid;grid-template-columns:44px 1fr;gap:4px 8px;align-items:center;font-size:11.5px;color:var(--ink-2)}
.help{font-size:11.5px;color:var(--muted);margin:8px 0 0}
kbd{font:10px var(--mono);border:1px solid var(--line-strong);padding:0 3px;border-radius:2px}

/* main */
.main{grid-area:main;position:relative;min-width:0;min-height:0;background:var(--canvas)}
.view{position:absolute;inset:0;overflow:auto}
#canvasView{overflow:hidden}
#svg{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
#svg.panning{cursor:grabbing}
.ctool{position:absolute;left:12px;top:12px;display:flex;gap:4px;flex-wrap:wrap;align-items:center;max-width:calc(100% - 24px)}
.ctool .btn{background:var(--panel)}
.ctool .zm{font:11px var(--mono);min-width:44px;text-align:center;background:var(--panel);border:1px solid var(--line);padding:4px 4px}
.banner{position:absolute;left:12px;bottom:12px;right:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--ink);padding:6px 10px;font-size:12px;max-width:760px}
.banner b{font-family:var(--mono)}
.orient{position:absolute;right:12px;top:12px;font:10px var(--mono);color:var(--muted);background:var(--panel);border:1px solid var(--line);padding:4px 6px;line-height:1.5;text-align:right}

/* svg */
.zone rect{fill:var(--zone);stroke:var(--line-strong);stroke-dasharray:5 4;stroke-width:1}
.zone.off rect{fill:var(--zone-off)}
.zone text{font:700 11px var(--mono);fill:var(--muted);letter-spacing:.12em;cursor:pointer}
.zone text.zc{font-weight:400;letter-spacing:.02em;font-size:10px}
.vehicle{fill:none;stroke:var(--line-strong);stroke-width:1.2}
.vlabel{font:10px var(--mono);fill:var(--muted);letter-spacing:.14em}
.node{cursor:pointer}
.node .nb{fill:var(--panel);stroke:var(--ink);stroke-width:1.2}
.node .nh{fill:var(--head)}
.node .nref{font:700 11.5px var(--mono);fill:var(--head-ink)}
.node .ncat{font:10px var(--mono);fill:var(--head-ink);opacity:.75}
.node .nname{font:500 11.5px var(--sans);fill:var(--ink)}
.node .nmeta{font:9.5px var(--mono);fill:var(--muted)}
.node .noref{fill:var(--danger)}
.node.gb .nb{stroke-dasharray:3 2}
.node.sel .nb{stroke:var(--accent);stroke-width:3}
.node.nbr .nb{stroke:var(--accent);stroke-width:1.8}
.node:hover .nb{stroke-width:2.2}
.node.dim{opacity:.16}
.node .wm{fill:var(--warn-bg);stroke:var(--warn);stroke-width:1}
.node .wt{font:700 9px var(--mono);fill:var(--warn)}
path{fill:none}
.e{stroke-linejoin:round}
.e-power{stroke:var(--pwr)}
.e-power.hv{stroke-width:4.6}
.e-power.lv{stroke-width:2.4}
.e-ground{stroke:var(--gnd);stroke-width:2;stroke-dasharray:9 4}
.e-can{stroke:var(--can);stroke-width:4.4}
.e-can-in{stroke:var(--canvas);stroke-width:1.5}
.e-signal{stroke:var(--sig);stroke-width:1.5;stroke-dasharray:1.5 3;stroke-linecap:round}
.edge.dim{opacity:.08}
.edge.sel .glow,.edge.hl .glow{stroke:var(--accent);stroke-opacity:.28;stroke-width:12}
.hit{stroke:transparent;stroke-width:11;pointer-events:stroke;cursor:pointer}
.el{font:9.5px var(--mono);paint-order:stroke;stroke:var(--canvas);stroke-width:3.5px;stroke-linejoin:round;pointer-events:none}
.el.power{fill:var(--pwr)} .el.ground{fill:var(--gnd)} .el.can{fill:var(--can)} .el.signal{fill:var(--sig)}
.ctag rect{fill:var(--panel);stroke:var(--ink);stroke-width:1}
.ctag text{font:700 8.5px var(--mono);fill:var(--ink)}
.xconn{cursor:pointer}
.xconn rect{fill:var(--panel);stroke:var(--ink);stroke-width:1.4}
.xconn .xi{fill:none;stroke:var(--ink);stroke-width:.8}
.xconn text{font:700 10px var(--mono);fill:var(--ink)}
.xconn.sel rect{stroke:var(--accent);stroke-width:2.5}
.xconn.dim{opacity:.2}

/* tables & pages */
.page{padding:16px 18px 40px;max-width:1500px}
.page h2{font-size:18px;margin:0 0 4px;font-weight:600;text-wrap:balance}
.page .lede{color:var(--muted);margin:0 0 14px;max-width:80ch}
.stats{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--line-strong);background:var(--panel);margin-bottom:14px;width:max-content;max-width:100%}
.stat{padding:8px 16px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat .v{font:700 20px var(--mono);font-variant-numeric:tabular-nums;line-height:1.1}
.stat .l{font:10px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;align-items:center}
.filters input,.filters select{padding:5px 7px;border:1px solid var(--line-strong);background:var(--panel);border-radius:2px;font-size:12px}
.tw{overflow:auto;border:1px solid var(--line-strong);background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:12px}
th{position:sticky;top:0;background:var(--panel);text-align:left;font:700 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:7px 8px;border-bottom:1px solid var(--ink);white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:var(--ink)}
th .ar{opacity:.8}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
td.id{font-family:var(--mono);font-weight:700;white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--accent-soft)}
tbody tr.act td{background:var(--accent-soft)}
.dash{color:var(--line-strong)}
.tp{font:10px var(--mono);text-transform:uppercase;letter-spacing:.04em}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px}
.card{border:1px solid var(--line-strong);background:var(--panel);padding:12px 14px;min-width:0}
.card h3{font-size:13.5px;margin:0 0 6px;font-weight:600;text-wrap:balance}
.card .meta{font:11px var(--mono);color:var(--muted)}
.card ul{margin:8px 0;padding-left:16px;font-size:12px}
.card .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.note{border-left:3px solid var(--warn);background:var(--warn-bg);padding:6px 10px;font-size:12px;color:var(--ink);margin:8px 0}
.matrix td,.matrix th{text-align:center;padding:5px 6px;cursor:default}
.matrix th.rh{text-align:right}
.matrix td.cell{cursor:pointer;font-family:var(--mono);font-variant-numeric:tabular-nums}
.matrix td.cell:hover{outline:2px solid var(--accent);outline-offset:-2px}
h3.sh{font:700 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.wgroup{margin-bottom:14px}
.wgroup h3{font-size:13px;margin:0 0 6px;display:flex;gap:8px;align-items:center}
.witem{display:grid;grid-template-columns:90px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-top:0;background:var(--panel);padding:6px 10px;font-size:12px;text-align:left;width:100%}
.witem:first-of-type{border-top:1px solid var(--line)}
.witem:hover{background:var(--accent-soft)}
.sev{font:700 9.5px var(--mono);letter-spacing:.06em;padding:1px 5px;border:1px solid var(--warn);color:var(--warn);background:var(--warn-bg);text-align:center}
.sev.info{border-color:var(--line-strong);color:var(--muted);background:none}

/* inspector */
.insp-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.insp-ref{font:700 20px var(--mono);line-height:1.1;word-break:break-all}
.insp-name{font-size:14px;font-weight:500;margin-top:2px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;font-size:12px;margin:10px 0 0}
.kv dt{color:var(--muted);font:10.5px var(--mono);text-transform:uppercase;letter-spacing:.04em;padding-top:2px}
.kv dd{margin:0;min-width:0;word-wrap:break-word}
.tbd{color:var(--muted);font-style:italic}
.btnrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.clist{display:flex;flex-direction:column;margin-top:4px}
.citem{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:5px 0;font-size:12px}
.citem:hover{background:var(--accent-soft)}
.citem .to{font-family:var(--mono);font-weight:700}
.citem .sg{grid-column:2;color:var(--muted);font-size:11.5px}
.lg{display:inline-block;width:26px;height:10px;vertical-align:middle}
.empty{color:var(--muted);font-size:12px;font-style:italic}
.confirm{border:1px solid var(--danger);padding:8px 10px;margin-top:10px;font-size:12px}
.form{display:flex;flex-direction:column;gap:9px}
.form label{display:flex;flex-direction:column;gap:3px;font:10.5px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.form label.ck{flex-direction:row;align-items:center;gap:8px;text-transform:none;font:12px var(--sans);color:var(--ink)}
.form input[type=text],.form input[type=number],.form select,.form textarea{padding:5px 7px;border:1px solid var(--line-strong);background:var(--bg);border-radius:2px;font:12px var(--sans);text-transform:none;letter-spacing:0;color:var(--ink);width:100%}
.form textarea{min-height:56px;resize:vertical}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form .multi{border:1px solid var(--line-strong);background:var(--bg);max-height:180px;overflow:auto;padding:4px 6px;display:flex;flex-direction:column;gap:2px;text-transform:none;letter-spacing:0}
.form .multi label{flex-direction:row;align-items:flex-start;gap:6px;font:11.5px var(--sans);color:var(--ink);text-transform:none}
.form .multi .ex{color:var(--muted)}
.err{color:var(--danger);font-size:12px}
.subhead{font:700 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 0 2px;display:flex;justify-content:space-between;align-items:center}

/* status */
.status{grid-area:status;display:flex;gap:18px;align-items:center;padding:0 14px;height:28px;border-top:1px solid var(--line);background:var(--panel);font:11px var(--mono);color:var(--ink-2);overflow-x:auto;white-space:nowrap}
.status b{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.status .w b{color:var(--warn)}
.status .sp{flex:1}

/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:grid;place-items:center;z-index:50;padding:16px}
.modal .box{background:var(--panel);border:1px solid var(--ink);width:min(780px,100%);max-height:100%;overflow:auto;padding:16px}
.modal textarea{width:100%;min-height:300px;font:11px var(--mono);border:1px solid var(--line-strong);background:var(--bg);padding:8px}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "main" "status"}
  .left,.right{position:fixed;top:50px;bottom:28px;width:min(340px,92vw);z-index:30;display:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.25)}
  .left{left:0}.right{right:0}
  body.show-left .left,body.show-right .right{display:block}
  .narrow-only{display:inline-flex}
  .brand .t2,.brand .t1,.top .actions .wide{display:none}
  .top{overflow:hidden}
  .top{gap:8px;padding:0 8px}
  .orient{display:none}
  .cards{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<!--
  ============================================================================
  ARCHITECTURE DATASET  (placeholder — replace with the real E / eBacco data)
  ----------------------------------------------------------------------------
  The UI is generated entirely from this JSON. To swap datasets either:
    a) replace the contents of this <script> block, or
    b) use "Data → Import JSON" inside the app (kept in this browser only).
  Schema (all ids are internal keys; "ref" is the visible reference code):
    categories : { CODE: {name, needsPower, needsGround} }
    zones      : [{id, name, x, y, w, h}]              canvas rectangles (plan view, front at top)
    components : [{id, ref, name, category, zone, supply, can, x, y, notes, needsPower?, needsGround?}]
    connectors : [{id, label, component|null, family, pins|null, class, zone?, x?, y?, notes}]
                 component=null → inline / intermediate connector (X01…), placed at x,y
    connections: [{id, from, fromConn, to, toConn, layer: power|ground|can|signal,

}

<script>
(() => {
'use strict';
// ---------------------------------------------------------------------------
// constants
const NW = 160, NH = 52;               // node size (canvas units)
const STORE_KEY = 'eden-eae-dataset-v1';
const LAYER_META = {
  power:  {name:'Power',   short:'PWR', desc:'High-current & distribution'},
  ground: {name:'Ground',  short:'GND', desc:'Returns, ground points, chassis'},
  can:    {name:'CAN',     short:'CAN', desc:'CAN-H / CAN-L pairs'},
  signal: {name:'Signals', short:'SIG', desc:'DI / AI / DO / PWM / sensors'}
};
const H_TYPES = {p2p:'Point-to-point', branched:'Branched', bus:'Bus'};
const H_STATUS = ['Defined','Draft','TBD'];

// ---------------------------------------------------------------------------
// state
const S = {
  data:null, source:'placeholder',
  view:'arch',
  layers:{power:true, ground:false, cansig:false, can:true, signal:true},
  detail:'simple', labels:true, locked:true,
  zonesOn:new Set(), zoneMode:'dim',
  sel:null,               // {type:'comp'|'harness'|'conn'|'connector'|'zone', id}
  focus:null,             // {id, mode:'highlight'|'isolate', depth}
  hl:null,                // {label, conns:Set, comps:Set, harness?}
  edit:null,              // {type, id|null, confirmDelete?}
  tx:0, ty:0, k:1,
  search:'',
  tsort:{key:'id', dir:1}, tfilter:{q:'', type:'', status:'', layer:''}
};
const ix = {};

// ---------------------------------------------------------------------------
// helpers
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const push = (m, k, v) => { if (!m.has(k)) m.set(k, []); m.get(k).push(v); };
const uniq = a => [...new Set(a)];
const tbd = v => (v === null || v === undefined || v === '') ? '<span class="tbd">TBD</span>' : esc(v);
const clone = o => JSON.parse(JSON.stringify(o));
function refOf(id){ const c = ix.comp.get(id); if (!c) return '?' + id; return c.ref || '(no ref)'; }
function connLabel(cid){
  if (!cid) return null;
  const k = ix.connector.get(cid);
  if (!k) return cid + ' (undefined)';
  return k.component ? `${refOf(k.component)} ${k.label}` : k.label;
}
function zoneName(id){ return ix.zone.get(id)?.name || id || 'Unzoned'; }
function catName(code){ return S.data.categories[code]?.name || code || '—'; }
function layerOf(w){ return w.layer; }

// ---------------------------------------------------------------------------
// data load / save
function loadData(){
  const placeholder = JSON.parse(document.getElementById('arch-data').textContent);
  let d = null;
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) { d = JSON.parse(raw); S.source = 'local'; } } catch(e) { d = null; }
  S.data = normalise(d || placeholder);
  S.placeholder = placeholder;
}
function normalise(d){
  d.meta = d.meta || {name:'Architecture'};
  d.categories = d.categories || {};
  for (const k of ['zones','components','connectors','connections','harnesses']) d[k] = Array.isArray(d[k]) ? d[k] : [];
  d.connections.forEach(w => { w.via = Array.isArray(w.via) ? w.via : []; if (w.wires == null) w.wires = null; });
  d.harnesses.forEach(h => { h.connB = Array.isArray(h.connB) ? h.connB : (h.connB ? [h.connB] : []); });
  return d;
}
function save(){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S.data)); S.source = 'local'; } catch(e) {}
}
function commit(){ save(); reindex(); renderAll(); }

// ---------------------------------------------------------------------------
// index & derived data
function reindex(){
  const d = S.data;
  ix.comp = new Map(d.components.map(c => [c.id, c]));
  ix.connector = new Map(d.connectors.map(c => [c.id, c]));
  ix.zone = new Map(d.zones.map(z => [z.id, z]));
  ix.harness = new Map(d.harnesses.map(h => [h.id, h]));
  ix.wire = new Map(d.connections.map(w => [w.id, w]));
  ix.byComp = new Map(); ix.byHarness = new Map(); ix.byConnector = new Map(); ix.connsOfComp = new Map();
  for (const w of d.connections){
    push(ix.byComp, w.from, w); if (w.to !== w.from) push(ix.byComp, w.to, w);
    if (w.harness) push(ix.byHarness, w.harness, w);
    if (w.fromConn) push(ix.byConnector, w.fromConn, w);
    if (w.toConn && w.toConn !== w.fromConn) push(ix.byConnector, w.toConn, w);
    for (const v of w.via) push(ix.byConnector, v, w);
  }
  for (const k of d.connectors) if (k.component) push(ix.connsOfComp, k.component, k);
  if (S.zonesOn.size === 0 && !S._zonesInit){ d.zones.forEach(z => S.zonesOn.add(z.id)); S._zonesInit = true; }
  ix.warnings = validate();
  ix.warnByComp = new Map();
  for (const w of ix.warnings) if (w.target?.type === 'comp') push(ix.warnByComp, w.target.id, w);
}

function pinsUsed(cid){
  const ws = (ix.byConnector.get(cid) || []).filter(w => w.fromConn === cid || w.toConn === cid);
  const seen = new Set(); let n = 0;
  for (const w of ws){
    // bus pairs leaving the same connector in the same harness share pins (spliced backbone)
    const key = w.layer === 'can' ? `can|${w.harness || w.id}|${w.signal}` : w.id;
    if (seen.has(key)) continue; seen.add(key); n += (+w.wires || 0);
  }
  return n;
}

function hInfo(h){
  const conns = ix.byHarness.get(h.id) || [];
  const layers = uniq(conns.map(layerOf));
  const est = conns.reduce((s, w) => s + (+w.wires || 0), 0);
  const comps = uniq(conns.flatMap(w => [w.from, w.to]));
  let origin = null;
  if (h.connA){ const k = ix.connector.get(h.connA); origin = k?.component || null; }
  if (!origin && conns.length){
    const cnt = new Map(); conns.forEach(w => [w.from, w.to].forEach(c => cnt.set(c, (cnt.get(c) || 0) + 1)));
    origin = [...cnt.entries()].sort((a, b) => b[1] - a[1])[0][0];
  }
  const dests = comps.filter(c => c !== origin);
  const vias = uniq(conns.flatMap(w => w.via));
  const signals = uniq(conns.map(w => w.signal).filter(Boolean));
  const byLayer = {power:0, ground:0, can:0, signal:0};
  conns.forEach(w => byLayer[w.layer] = (byLayer[w.layer] || 0) + 1);
  const hv = conns.some(w => w.vclass === 'HV');
  return {conns, layers, est, conductors: h.conductors ?? est, origin, dests, vias, signals, byLayer, comps, hv};
}

// ---------------------------------------------------------------------------
// validation — every item is "requires review", not a verdict
function validate(){
  const d = S.data, W = [];
  const add = (check, sev, msg, target) => W.push({check, sev, msg, target});
  const refs = new Map();
  for (const c of d.components){
    if (!c.ref) add('noref', 'review', `“${c.name || c.id}” has no reference code`, {type:'comp', id:c.id});
    else push(refs, c.ref, c);
    if (c.zone && !ix.zone.has(c.zone)) add('zone', 'info', `${c.ref || c.id}: zone “${c.zone}” is not defined`, {type:'comp', id:c.id});
    const cs = ix.byComp.get(c.id) || [];
    const cat = d.categories[c.category] || {};
    const needP = c.needsPower ?? cat.needsPower ?? false;
    const needG = c.needsGround ?? cat.needsGround ?? false;
    if (!cs.length) add('isolated', 'review', `${c.ref || c.name} has no connections`, {type:'comp', id:c.id});
    if (needP && !cs.some(w => w.layer === 'power')) add('nopower', 'review', `${c.ref || c.name} (${catName(c.category)}) has no power connection`, {type:'comp', id:c.id});
    if (needG && !cs.some(w => w.layer === 'ground')) add('noground', 'review', `${c.ref || c.name} (${catName(c.category)}) has no ground connection`, {type:'comp', id:c.id});
  }
  for (const [ref, list] of refs) if (list.length > 1)
    list.forEach(c => add('dupref', 'review', `Reference ${ref} is used by ${list.length} components (“${c.name}”)`, {type:'comp', id:c.id}));

  // CAN network connectivity
  const canNodes = d.components.filter(c => c.can);
  const adj = new Map();
  for (const w of d.connections) if (w.layer === 'can'){ push(adj, w.from, w.to); push(adj, w.to, w.from); }
  const seen = new Map(); const clusters = [];
  for (const c of d.components){
    if (!adj.has(c.id) || seen.has(c.id)) continue;
    const cl = []; const st = [c.id]; seen.set(c.id, clusters.length);
    while (st.length){ const x = st.pop(); cl.push(x); for (const y of adj.get(x) || []) if (!seen.has(y)){ seen.set(y, clusters.length); st.push(y); } }
    clusters.push(cl);
  }
  let main = -1, best = -1;
  clusters.forEach((cl, i) => { const sc = cl.length + (cl.some(id => ix.comp.get(id)?.category === 'VCU') ? 1000 : 0); if (sc > best){ best = sc; main = i; } });
  for (const c of canNodes){
    if (!adj.has(c.id)) add('candisc', 'review', `${c.ref || c.name} is marked as a CAN node but has no CAN connection`, {type:'comp', id:c.id});
    else if (seen.get(c.id) !== main) add('candisc', 'review', `${c.ref || c.name} is on a CAN segment not linked to the main network`, {type:'comp', id:c.id});
  }
  for (const w of d.connections){
    if (w.layer === 'can') for (const e of [w.from, w.to]){ const c = ix.comp.get(e); if (c && !c.can) add('candisc', 'info', `${w.id}: CAN wiring reaches ${c.ref || c.name}, which is not marked as a CAN node`, {type:'conn', id:w.id}); }
    if (!w.harness) add('unassigned', 'review', `${w.id} ${refOf(w.from)} → ${refOf(w.to)} (${w.signal || w.layer}) is not assigned to a harness`, {type:'conn', id:w.id});
    else if (!ix.harness.has(w.harness)) add('unassigned', 'review', `${w.id} references harness ${w.harness}, which does not exist`, {type:'conn', id:w.id});
    if (!ix.comp.has(w.from) || !ix.comp.has(w.to)) add('broken', 'review', `${w.id} references a component that does not exist`, {type:'conn', id:w.id});
    for (const [cid, comp] of [[w.fromConn, w.from], [w.toConn, w.to]]){
      if (!cid) add('noconnconn', 'info', `${w.id}: connector at ${refOf(comp)} end not specified`, {type:'conn', id:w.id});
      else if (!ix.connector.has(cid)) add('broken', 'review', `${w.id}: connector ${cid} is not defined`, {type:'conn', id:w.id});
      else if (ix.connector.get(cid).component !== comp) add('broken', 'review', `${w.id}: connector ${connLabel(cid)} does not belong to ${refOf(comp)}`, {type:'conn', id:w.id});
    }
  }
  for (const h of d.harnesses){
    const conns = ix.byHarness.get(h.id) || [];
    if (!h.connA || !h.connB.length) add('hnoconn', 'review', `${h.id} “${h.name}” has no ${!h.connA && !h.connB.length ? 'connectors' : (!h.connA ? 'side A connector' : 'side B connector')} defined`, {type:'harness', id:h.id});
    if (!conns.length) add('hempty', 'info', `${h.id} “${h.name}” carries no connections`, {type:'harness', id:h.id});
  }
  for (const k of d.connectors){
    const used = pinsUsed(k.id);
    if (k.pins != null && used > k.pins) add('pins', 'review', `${connLabel(k.id)}: ${used} conductors terminate on a ${k.pins}-pin connector`, {type:'connector', id:k.id});
  }
  return W;
}
const CHECKS = {
  nopower:   'Components without power',
  noground:  'Components without ground',
  isolated:  'Isolated components',
  candisc:   'CAN nodes disconnected from the CAN network',
  dupref:    'Duplicate reference IDs',
  unassigned:'Connections without an assigned harness',
  hnoconn:   'Harnesses without defined connectors',
  noref:     'Components without a reference code',
  pins:      'Connector pin count exceeded',
  hempty:    'Empty harnesses',
  noconnconn:'Connection ends without a connector',
  broken:    'Broken references',
  zone:      'Unknown vehicle zones'
};

// ---------------------------------------------------------------------------
// visibility model
function layerOn(w){
  const L = S.layers;
  if (w.layer === 'power') return L.power;
  if (w.layer === 'ground') return L.ground;
  if (w.layer === 'can') return L.cansig && L.can;
  if (w.layer === 'signal') return L.cansig && L.signal;
  return false;
}
function neighbourhood(id, depth){
  const set = new Set([id]); let frontier = [id];
  for (let i = 0; i < depth; i++){
    const next = [];
    for (const x of frontier) for (const w of ix.byComp.get(x) || []){
      if (!layerOn(w)) continue;
      for (const y of [w.from, w.to]) if (!set.has(y)){ set.add(y); next.push(y); }
    }
    frontier = next;
  }
  return set;
}
function visibility(){
  const comp = new Map(), conn = new Map();
  const F = S.focus && ix.comp.has(S.focus.id) ? S.focus : null;
  const fset = F ? neighbourhood(F.id, F.mode === 'isolate' ? F.depth : 1) : null;
  for (const c of S.data.components){
    let st = 'n';
    if (!S.zonesOn.has(c.zone)) st = S.zoneMode === 'hide' ? 'h' : 'd';
    if (fset){
      if (fset.has(c.id)) st = 'n';
      else st = F.mode === 'isolate' ? 'h' : 'd';
    }
    if (S.hl){
      if (S.hl.comps.has(c.id)) { if (st !== 'h' || !fset) st = 'n'; }
      else if (st === 'n') st = 'd';
    }
    comp.set(c.id, st);
  }
  for (const w of S.data.connections){
    const a = comp.get(w.from), b = comp.get(w.to);
    if (a === undefined || b === undefined) { conn.set(w.id, 'h'); continue; }
    const inHl = S.hl?.conns.has(w.id);
    let st = 'n';
    if (!layerOn(w) && !inHl) st = 'h';
    else if (a === 'h' || b === 'h') st = 'h';
    else if (F){
      if (F.mode === 'isolate') st = (fset.has(w.from) && fset.has(w.to)) ? 'n' : 'h';
      else st = (w.from === F.id || w.to === F.id) ? 'n' : 'd';
    }
    if (st !== 'h' && S.hl) st = inHl ? 'hl' : 'd';
    if (st === 'n' && !F && !S.hl){
      const za = S.zonesOn.has(ix.comp.get(w.from).zone), zb = S.zonesOn.has(ix.comp.get(w.to).zone);
      if (!za && !zb) st = S.zoneMode === 'hide' ? 'h' : 'd';
    }
    if (S.sel?.type === 'conn' && S.sel.id === w.id && st !== 'h') st = st === 'd' ? 'hl' : (st === 'n' ? 'sel' : st);
    conn.set(w.id, st);
  }
  return {comp, conn, fset};
}

// ---------------------------------------------------------------------------
// canvas geometry (orthogonal routing with distributed ports)
function center(c){ return {x:c.x + NW/2, y:c.y + NH/2}; }
function sideFor(c, p){
  const cc = center(c); const dx = p.x - cc.x, dy = p.y - cc.y;
  if (Math.abs(dx)/(NW/2) > Math.abs(dy)/(NH/2)) return dx > 0 ? 'r' : 'l';
  return dy > 0 ? 'b' : 't';
}
function xPos(id){ const k = ix.connector.get(id); return (k && !k.component && k.x != null) ? {x:k.x, y:k.y} : null; }
function geometry(wires){
  const groups = new Map(); const recs = [];
  for (const w of wires){
    const A = ix.comp.get(w.from), B = ix.comp.get(w.to);
    const vias = S.detail === 'detailed' ? w.via.map(xPos).filter(Boolean) : [];
    const tA = vias.length ? vias[0] : center(B);
    const tB = vias.length ? vias[vias.length - 1] : center(A);
    const r = {w, A, B, vias, sA:sideFor(A, tA), sB:sideFor(B, tB), tA, tB};
    recs.push(r);
    push(groups, w.from + '|' + r.sA, {r, end:'A', key:(r.sA === 'l' || r.sA === 'r') ? tA.y : tA.x});
    push(groups, w.to + '|' + r.sB, {r, end:'B', key:(r.sB === 'l' || r.sB === 'r') ? tB.y : tB.x});
  }
  for (const [gk, list] of groups){
    const [cid, side] = gk.split('|'); const c = ix.comp.get(cid);
    list.sort((a, b) => a.key - b.key || a.r.w.id.localeCompare(b.r.w.id));
    // detailed mode: every wire on the same connector leaves through one shared port
    const slotKey = e => S.detail === 'detailed' ? ((e.end === 'A' ? e.r.w.fromConn : e.r.w.toConn) || 'w:' + e.r.w.id) : e.r.w.id + e.end;
    const slots = uniq(list.map(slotKey));
    const n = list.length;
    list.forEach((e, i) => {
      const t = (slots.indexOf(slotKey(e)) + 1)/(slots.length + 1);
      let p;
      if (side === 'l') p = {x:c.x, y:c.y + 6 + t*(NH - 12)};
      else if (side === 'r') p = {x:c.x + NW, y:c.y + 6 + t*(NH - 12)};
      else if (side === 't') p = {x:c.x + 8 + t*(NW - 16), y:c.y};
      else p = {x:c.x + 8 + t*(NW - 16), y:c.y + NH};
      const lane = Math.max(-8, Math.min(8, i - (n - 1)/2));
      if (e.end === 'A'){ e.r.pA = p; e.r.lA = lane; } else { e.r.pB = p; e.r.lB = lane; }
    });
  }
  for (const r of recs){
    const pts = [r.pA, ...r.vias, r.pB];
    let d = `M${r.pA.x},${r.pA.y}`; let lab = null;
    for (let i = 0; i < pts.length - 1; i++){
      const P = pts[i], Q = pts[i + 1];
      const sP = i === 0 ? r.sA : null, sQ = i === pts.length - 2 ? r.sB : null;
      const seg = route(P, sP, Q, sQ, (r.lA || 0)*6 + (r.lB || 0)*2);
      d += seg.d; if (!lab) lab = seg.l;
    }
    r.d = d; r.lab = lab;
  }
  return recs;
}
function route(P, sP, Q, sQ, lane){
  const horiz = s => s === 'l' || s === 'r';
  const hP = sP ? horiz(sP) : !horiz(sQ || 't');
  const hQ = sQ ? horiz(sQ) : !hP;
  if (hP && hQ){
    let mx = (P.x + Q.x)/2 + lane;
    const out = sP === 'r' ? 1 : -1;
    if ((Q.x - P.x)*out < 24) mx = P.x + out*(18 + Math.abs(lane));
    return {d:` H${mx} V${Q.y} H${Q.x}`, l:{x:mx, y:(P.y + Q.y)/2}};
  }
  if (!hP && !hQ){
    let my = (P.y + Q.y)/2 + lane;
    const out = sP === 'b' ? 1 : -1;
    if (sP && (Q.y - P.y)*out < 24) my = P.y + out*(18 + Math.abs(lane));
    return {d:` V${my} H${Q.x} V${Q.y}`, l:{x:(P.x + Q.x)/2, y:my}};
  }
  if (hP) return {d:` H${Q.x} V${Q.y}`, l:{x:(P.x + Q.x)/2, y:P.y}};
  return {d:` V${Q.y} H${Q.x}`, l:{x:P.x, y:(P.y + Q.y)/2}};
}

// canvas render
function renderCanvas(){
  const d = S.data, V = visibility();
  let s = '';
  // ground grid in world space
  s += `<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="var(--line)" stroke-width=".5" opacity=".6"/></pattern></defs>`;
  s += `<rect x="-2000" y="-2000" width="6000" height="5300" fill="url(#grid)"/>`;
  // vehicle outline (derived from zone extents)
  if (d.zones.length){
    const x0 = Math.min(...d.zones.map(z => z.x)) - 14, y0 = Math.min(...d.zones.map(z => z.y)) - 14;
    const x1 = Math.max(...d.zones.map(z => z.x + z.w)) + 14, y1 = Math.max(...d.zones.map(z => z.y + z.h)) + 14;
    s += `<rect class="vehicle" x="${x0}" y="${y0}" width="${x1 - x0}" height="${y1 - y0}" rx="18"/>`;
    s += `<text class="vlabel" x="${(x0 + x1)/2}" y="${y0 - 8}" text-anchor="middle">▲ FRONT</text>`;
    s += `<text class="vlabel" x="${(x0 + x1)/2}" y="${y1 + 18}" text-anchor="middle">REAR ▼</text>`;
  }
  for (const z of d.zones){
    const n = d.components.filter(c => c.zone === z.id).length;
    s += `<g class="zone ${S.zonesOn.has(z.id) ? '' : 'off'}"><rect x="${z.x}" y="${z.y}" width="${z.w}" height="${z.h}"/>`
      + `<text x="${z.x + 10}" y="${z.y + 18}" data-zone="${esc(z.id)}">${esc(z.name.toUpperCase())}</text>`
      + `<text class="zc" x="${z.x + z.w - 10}" y="${z.y + 18}" text-anchor="end">${n} units</text></g>`;
  }
  // edges
  const wires = d.connections.filter(w => V.conn.get(w.id) !== 'h' && ix.comp.has(w.from) && ix.comp.has(w.to));
  const recs = geometry(wires);
  const order = {d:0, n:1, sel:2, hl:2};
  recs.sort((a, b) => order[V.conn.get(a.w.id)] - order[V.conn.get(b.w.id)]);
  const showLab = r => {
    const st = V.conn.get(r.w.id);
    if (st === 'd') return false;
    if (st === 'hl' || st === 'sel') return true;
    if (S.focus && (r.w.from === S.focus.id || r.w.to === S.focus.id)) return S.labels;
    return S.labels && S.k >= 0.8;
  };
  let labels = '', tags = '';
  const tagSeen = new Set();
  for (const r of recs){
    const w = r.w, st = V.conn.get(w.id);
    const cls = `edge ${st === 'd' ? 'dim' : st === 'hl' ? 'hl' : st === 'sel' ? 'sel' : ''}`;
    let body = (st === 'hl' || st === 'sel') ? `<path class="glow" d="${r.d}"/>` : '';
    if (w.layer === 'power') body += `<path class="e e-power ${w.vclass === 'HV' ? 'hv' : 'lv'}" d="${r.d}"/>`;
    else if (w.layer === 'ground') body += `<path class="e e-ground" d="${r.d}"/>`;
    else if (w.layer === 'can') body += `<path class="e e-can" d="${r.d}"/><path class="e e-can-in" d="${r.d}"/>`;
    else body += `<path class="e e-signal" d="${r.d}"/>`;
    const tip = `${w.id} · ${LAYER_META[w.layer]?.name || w.layer}${w.vclass ? ' ' + w.vclass : ''} · ${w.signal || ''}\n${refOf(w.from)} → ${refOf(w.to)} · ${w.wires ?? '?'} wire(s) · ${w.harness || 'no harness'}`;
    body += `<path class="hit" data-conn="${esc(w.id)}" d="${r.d}"><title>${esc(tip)}</title></path>`;
    s += `<g class="${cls}">${body}</g>`;
    if (showLab(r) && r.lab){
      let t = S.detail === 'detailed' ? `${w.harness || '—'} · ${w.signal || ''}` : (w.signal || LAYER_META[w.layer].short);
      if (t.length > 30) t = t.slice(0, 29) + '…';
      const pre = w.layer === 'ground' ? '⏚ ' : w.layer === 'can' ? '' : '';
      const dy = {power:-4, ground:8, can:20, signal:32}[w.layer] ?? 0;
      labels += `<text class="el ${w.layer}" x="${r.lab.x + 4}" y="${r.lab.y + dy}">${esc(pre + t)}</text>`;
    }
    if (S.detail === 'detailed' && st !== 'd'){
      for (const [p, cid, side] of [[r.pA, w.fromConn, r.sA], [r.pB, w.toConn, r.sB]]){
        if (!cid) continue;
        const k = ix.connector.get(cid); const lab = k ? k.label : '?';
        const off = {l:[-12, 0], r:[12, 0], t:[0, -9], b:[0, 9]}[side];
        const x = p.x + off[0], y = p.y + off[1];
        const key = cid + '|' + Math.round(x) + '|' + Math.round(y);
        if (tagSeen.has(key)) continue; tagSeen.add(key);
        const tw = Math.max(18, lab.length*6 + 6);
        tags += `<g class="ctag" data-connector="${esc(cid)}"><rect x="${x - tw/2}" y="${y - 6}" width="${tw}" height="12"/><text x="${x}" y="${y + 3}" text-anchor="middle">${esc(lab)}</text></g>`;
      }
    }
  }
  // inline connectors (detailed mode)
  let xs = '';
  if (S.detail === 'detailed'){
    for (const k of d.connectors){
      if (k.component || k.x == null) continue;
      const ws = ix.byConnector.get(k.id) || [];
      const anyVis = ws.some(w => { const st = V.conn.get(w.id); return st && st !== 'h' && st !== 'd'; });
      const sel = S.sel?.type === 'connector' && S.sel.id === k.id;
      xs += `<g class="xconn ${anyVis || sel ? '' : 'dim'} ${sel ? 'sel' : ''}" data-connector="${esc(k.id)}" transform="translate(${k.x},${k.y})">`
        + `<rect x="-22" y="-10" width="44" height="20"/><path class="xi" d="M-16,-10V10M16,-10V10"/><text y="4" text-anchor="middle">${esc(k.label)}</text></g>`;
    }
  }
  // nodes
  let ns = '';
  for (const c of d.components){
    const st = V.comp.get(c.id); if (st === 'h') continue;
    const sel = S.sel?.type === 'comp' && S.sel.id === c.id;
    const warns = (ix.warnByComp.get(c.id) || []).length;
    let name = c.name || ''; if (name.length > 25) name = name.slice(0, 24) + '…';
    const meta = [c.supply ? c.supply : null, c.can ? 'CAN' : null].filter(Boolean).join(' · ');
    const metaT = meta.length > 28 ? meta.slice(0, 27) + '…' : meta;
    ns += `<g class="node ${c.category === 'GB' ? 'gb' : ''} ${st === 'd' ? 'dim' : ''} ${sel ? 'sel' : ''}" data-node="${esc(c.id)}" transform="translate(${c.x},${c.y})">`
      + `<rect class="nb" width="${NW}" height="${NH}"/><rect class="nh" x=".6" y=".6" width="${NW - 1.2}" height="17"/>`
      + (c.ref ? `<text class="nref" x="7" y="13">${esc(c.ref)}</text>` : `<text class="nref noref" x="7" y="13">NO REF</text>`)
      + `<text class="ncat" x="${NW - 7}" y="13" text-anchor="end">${esc(c.category || '')}</text>`
      + `<text class="nname" x="7" y="33">${esc(name)}</text>`
      + `<text class="nmeta" x="7" y="46">${esc(metaT)}</text>`
      + (warns ? `<g><rect class="wm" x="${NW - 22}" y="36" width="16" height="12" rx="1"/><text class="wt" x="${NW - 14}" y="45.5" text-anchor="middle">${warns}</text><title>${warns} item(s) to review</title></g>` : '')
      + `</g>`;
  }
  $('#vp').innerHTML = s + ns + xs + tags + labels;
  applyTransform();
  renderBanner(V);
}
function applyTransform(){
  $('#vp').setAttribute('transform', `translate(${S.tx},${S.ty}) scale(${S.k})`);
  $('#zm').textContent = Math.round(S.k*100) + '%';
}
function fit(){
  const svg = $('#svg'); const r = svg.getBoundingClientRect();
  const d = S.data; if (!d.zones.length && !d.components.length) return;
  const xs = [...d.zones.map(z => z.x), ...d.components.map(c => c.x)], ys = [...d.zones.map(z => z.y), ...d.components.map(c => c.y)];
  const xe = [...d.zones.map(z => z.x + z.w), ...d.components.map(c => c.x + NW)], ye = [...d.zones.map(z => z.y + z.h), ...d.components.map(c => c.y + NH)];
  const x0 = Math.min(...xs) - 30, y0 = Math.min(...ys) - 40, x1 = Math.max(...xe) + 30, y1 = Math.max(...ye) + 40;
  const k = Math.min(r.width/(x1 - x0), (r.height - 40)/(y1 - y0));
  S.k = Math.max(0.15, Math.min(2.5, k));
  S.tx = (r.width - (x1 - x0)*S.k)/2 - x0*S.k;
  S.ty = (r.height - (y1 - y0)*S.k)/2 - y0*S.k + 10;
  applyTransform(); if (S.labels) renderCanvas();
}
function centerOn(x, y, minK){
  const r = $('#svg').getBoundingClientRect();
  if (minK && S.k < minK) S.k = minK;
  S.tx = r.width/2 - x*S.k; S.ty = r.height/2 - y*S.k;
  applyTransform();
}
function fitComps(ids){
  const cs = ids.map(id => ix.comp.get(id)).filter(Boolean); if (!cs.length) return;
  const r = $('#svg').getBoundingClientRect();
  const x0 = Math.min(...cs.map(c => c.x)) - 60, y0 = Math.min(...cs.map(c => c.y)) - 60;
  const x1 = Math.max(...cs.map(c => c.x + NW)) + 60, y1 = Math.max(...cs.map(c => c.y + NH)) + 60;
  S.k = Math.max(0.2, Math.min(1.4, Math.min(r.width/(x1 - x0), r.height/(y1 - y0))));
  S.tx = (r.width - (x1 - x0)*S.k)/2 - x0*S.k; S.ty = (r.height - (y1 - y0)*S.k)/2 - y0*S.k;
  applyTransform();
}

function searchResults(q){
  q = (q || '').trim().toLowerCase(); if (!q) return [];
  const d = S.data, out = [];
  const m = s => String(s || '').toLowerCase().includes(q);
  const exact = s => String(s || '').toLowerCase() === q;
  for (const c of d.components) if (m(c.ref) || m(c.name) || m(catName(c.category))) out.push({t:'comp', id:c.id, k:'Unit', a:c.ref || 'NO REF', b:c.name, s:exact(c.ref) ? 0 : 1});
  for (const h of d.harnesses) if (m(h.id) || m(h.name)) out.push({t:'harness', id:h.id, k:'Harness', a:h.id, b:h.name, s:exact(h.id) ? 0 : 2});
  for (const k of d.connectors) if (m(k.id) || (!k.component && m(k.label)) || m(k.family)) out.push({t:'connector', id:k.id, k:'Connector', a:connLabel(k.id), b:k.family || '', s:exact(k.label) ? 0 : 3});
  for (const w of d.connections) if (m(w.id) || m(w.signal)) out.push({t:'conn', id:w.id, k:'Wire', a:w.id, b:`${refOf(w.from)} → ${refOf(w.to)} · ${w.signal || ''}`, s:exact(w.id) ? 0 : 4});
  for (const z of d.zones) if (m(z.name)) out.push({t:'zone', id:z.id, k:'Zone', a:z.name, b:'', s:5});
  return out.sort((a, b) => a.s - b.s).slice(0, 14);
}

function inspZone(id){
  const z = ix.zone.get(id); if (!z) return '';

const fv = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
const fnum = id => { const v = fv(id); return v === '' ? null : Math.max(0, +v); };
const fchecks = name => [...document.querySelectorAll(`input[name="${name}"]:checked`)].map(i => i.value);
function nextId(prefix, list, width){
  let n = 0; for (const x of list){ const m = String(x.id).match(new RegExp('^' + prefix + '(\\d+)$')); if (m) n = Math.max(n, +m[1]); }

}
const nextHarnessId = () => nextId('H-', S.data.harnesses, 3);
function saveEdit(){
  const E = S.edit, d = S.data;
  if (E.type === 'comp'){
    const name = fv('f-name'); if (!name) return failEdit('Give the component a name.');
    const v = {ref:fv('f-ref'), name, category:fv('f-category'), zone:fv('f-zone'), supply:fv('f-supply') || null, can:document.getElementById('f-can').checked, notes:fv('f-notes')};
    if (E.id){ Object.assign(ix.comp.get(E.id), v); }

      let base = (v.ref || name).toLowerCase().replace(/[^a-z0-9]/g, '') || 'unit', id = base, i = 2;
      while (ix.comp.has(id)) id = base + '_' + i++;
      const z = ix.zone.get(v.zone) || {x:0, y:0, w:400, h:300};
      const nIn = d.components.filter(c => c.zone === v.zone).length;
      const pos = {x:Math.round(z.x + 30 + (nIn % 3)*190), y:Math.round(z.y + 40 + Math.floor(nIn/3)*90)};
      d.components.push({id, ...v, ...pos});
      E.id = id;
    }
    S.sel = {type:'comp', id:E.id};
  } else if (E.type === 'conn'){
    const from = fv('f-from'), to = fv('f-to');
    if (!from || !to) return failEdit('Choose both the source and destination units.');
    const v = {from, fromConn:fv('f-fromConn') || null, to, toConn:fv('f-toConn') || null, layer:fv('f-layer'), vclass:fv('f-vclass'), signal:fv('f-signal'), kind:fv('f-kind') || null, wires:fnum('f-wires'), gauge:fv('f-gauge') || null, harness:fv('f-harness') || null, via:fchecks('f-via'), notes:fv('f-notes')};
    if (E.id) Object.assign(ix.wire.get(E.id), v);
    else { const id = nextId('W', d.connections, 3); d.connections.push({id, ...v}); E.id = id; }
    const L = S.layers; if (v.layer === 'power') L.power = true; else if (v.layer === 'ground') L.ground = true; else { L.cansig = true; L[v.layer] = true; }
    S.sel = {type:'conn', id:E.id};
  } else if (E.type === 'harness'){
    const name = fv('f-name'); if (!name) return failEdit('Give the harness a name.');
    const v = {name, type:fv('f-type'), status:fv('f-status'), connA:fv('f-connA') || null, connB:fchecks('f-connB'), conductors:fnum('f-conductors'), notes:fv('f-notes')};
    let id = E.id;
    if (id) Object.assign(ix.harness.get(id), v);
    else { id = nextHarnessId(); d.harnesses.push({id, ...v}); }
    const chosen = new Set(fchecks('f-conns'));
    for (const w of d.connections){ if (chosen.has(w.id)) w.harness = id; else if (w.harness === id) w.harness = null; }
    S.sel = {type:'harness', id};
  } else if (E.type === 'connector'){
    const label = fv('f-label'); if (!label) return failEdit('Give the connector a label such as J1 or X04.');
    const component = fv('f-component') || null;
    const newId = component ? `${component}.${label}` : label;
    if (newId !== E.id && ix.connector.has(newId)) return failEdit(`Connector ${newId} already exists.`);
    const v = {label, component, family:fv('f-family') || null, pins:fnum('f-pins'), class:fv('f-class') || null, zone:fv('f-zone') || null, notes:fv('f-notes')};
    if (E.id){
      const k = ix.connector.get(E.id); Object.assign(k, v);
      if (newId !== E.id) renameConnector(E.id, newId);
    } else {
      const k = {id:newId, ...v};
      if (!component){ const z = ix.zone.get(v.zone) || {x:960, y:620, w:80, h:20}; k.x = Math.round(z.x + z.w/2); k.y = Math.round(z.y + z.h - 14); }
      d.connectors.push(k);
    }

  }

}
function failEdit(msg){ S.edit.err = msg; renderRight(); }
function renameConnector(oldId, newId){
  const d = S.data; ix.connector.get(oldId).id = newId;
  for (const w of d.connections){ if (w.fromConn === oldId) w.fromConn = newId; if (w.toConn === oldId) w.toConn = newId; w.via = w.via.map(v => v === oldId ? newId : v); }

}
function doDelete(){
  const [type, id] = S.confirm.split(/:(.*)/s); const d = S.data;
  if (type === 'comp'){
    const kids = new Set(d.connectors.filter(k => k.component === id).map(k => k.id));
    d.components = d.components.filter(c => c.id !== id);
    d.connectors = d.connectors.filter(k => k.component !== id);
    d.connections = d.connections.filter(w => w.from !== id && w.to !== id);
    for (const h of d.harnesses){ if (kids.has(h.connA)) h.connA = null; h.connB = h.connB.filter(c => !kids.has(c)); }
    if (S.focus?.id === id) S.focus = null;
  } else if (type === 'harness'){
    d.harnesses = d.harnesses.filter(h => h.id !== id);
    d.connections.forEach(w => { if (w.harness === id) w.harness = null; });
    if (S.hl?.harness === id) S.hl = null;
  } else if (type === 'conn'){
    d.connections = d.connections.filter(w => w.id !== id);
  } else if (type === 'connector'){
    d.connectors = d.connectors.filter(k => k.id !== id);
    for (const w of d.connections){ if (w.fromConn === id) w.fromConn = null; if (w.toConn === id) w.toConn = null; w.via = w.via.filter(v => v !== id); }
    for (const h of d.harnesses){ if (h.connA === id) h.connA = null; h.connB = h.connB.filter(c => c !== id); }
  }
  S.sel = null; S.confirm = null; commit();
}

function zonePairs(){

    const a = ix.comp.get(w.from)?.zone, b = ix.comp.get(w.to)?.zone; if (!a || !b) continue;

}

  const d = S.data, W = ix.warnings.filter(w => w.sev === 'review').length;
  $('#status').innerHTML = `<span>Components: <b>${d.components.length}</b></span><span>Connections: <b>${d.connections.length}</b></span><span>Harnesses: <b>${d.harnesses.length}</b></span>
    <span class="w">Warnings: <b>${W}</b></span><span>Unassigned: <b>${d.connections.filter(w => !w.harness).length}</b></span>
    <span class="sp"></span><span>Layers: <b>${activeLayerNames() || 'none'}</b></span><span>${S.detail === 'detailed' ? 'Detailed' : 'Simplified'}</span>
    <span>${S.source === 'local' ? 'Local edits' : 'Placeholder data'}</span>`;
  $('#dsName').textContent = d.meta.placeholder ? 'Placeholder dataset' : (d.meta.name || '');
}
function renderView(){
  const map = {arch:'#canvasView', table:'#tableView', analysis:'#analysisView', warnings:'#warningsView'};
  for (const [k, sel] of Object.entries(map)) $(sel).hidden = S.view !== k;
  if (S.view === 'table') renderTable();
  if (S.view === 'analysis') renderAnalysis();
  if (S.view === 'warnings') renderWarnings();
}
function renderAll(){ renderTabs(); renderLeft(); renderRight(); renderView(); renderCanvas(); renderStatus(); }

// ---------------------------------------------------------------------------
// selection & highlight actions
function select(t, id, opts = {}){
  S.confirm = null; S.edit = null;
  if (t === 'comp'){
    S.sel = {type:'comp', id};
    if (S.focus && S.focus.id !== id) S.focus = {...S.focus, id};
    if (opts.locate){ S.view = 'arch'; renderView(); const c = ix.comp.get(id); if (c) centerOn(c.x + NW/2, c.y + NH/2, 0.9); }
  } else if (t === 'harness'){
    showHarness(id, opts.locate); return;
  } else if (t === 'conn'){
    S.sel = {type:'conn', id};
    const w = ix.wire.get(id);
    if (w && !layerOn(w)){ if (w.layer === 'power') S.layers.power = true; else if (w.layer === 'ground') S.layers.ground = true; else { S.layers.cansig = true; S.layers[w.layer] = true; } }
    if (opts.locate && w){ S.view = 'arch'; renderView(); fitComps([w.from, w.to]); }
  } else if (t === 'connector'){
    S.sel = {type:'connector', id};
    if (opts.locate){ const k = ix.connector.get(id); S.view = 'arch'; renderView();
      if (k?.component){ const c = ix.comp.get(k.component); centerOn(c.x + NW/2, c.y + NH/2, 0.9); }
      else if (k){ S.detail = 'detailed'; centerOn(k.x, k.y, 0.9); } }
  } else if (t === 'zone'){
    S.sel = {type:'zone', id};
    if (opts.locate){ const z = ix.zone.get(id); S.view = 'arch'; renderView(); if (z) centerOn(z.x + z.w/2, z.y + z.h/2); }
  }
  openRightOnNarrow();
  renderAll();
}
function showHarness(id, locate = true){
  const h = ix.harness.get(id); if (!h) return;
  const conns = ix.byHarness.get(id) || [];
  S.hl = {label:`${id} · ${h.name}`, harness:id, conns:new Set(conns.map(w => w.id)), comps:new Set(conns.flatMap(w => [w.from, w.to]))};
  S.focus = null; S.sel = {type:'harness', id}; S.edit = null; S.confirm = null;
  if (locate){ S.view = 'arch'; renderView(); fitComps([...S.hl.comps]); }
  openRightOnNarrow();
  renderAll();
}
function hlConns(label, ws, locate = true){
  S.hl = {label, conns:new Set(ws.map(w => w.id)), comps:new Set(ws.flatMap(w => [w.from, w.to]))};
  S.focus = null;
  if (locate){ S.view = 'arch'; renderView(); fitComps([...S.hl.comps]); }
  renderAll();
}
function openRightOnNarrow(){ if (matchMedia('(max-width:900px)').matches){ document.body.classList.remove('show-left'); document.body.classList.add('show-right'); } }

// ---------------------------------------------------------------------------
// data modal
function openDataModal(msg){
  const m = $('#modal');
  m.innerHTML = `<div class="box" role="dialog" aria-label="Import or export architecture data">
    <div class="eyebrow">Architecture data (JSON) <button class="lnk" data-act="closeModal">Close ✕</button></div>
    <p class="help" style="margin:0 0 8px">This JSON is the whole architecture: components, connectors, connections, harnesses and zones. Copy it to keep your edits, or paste a dataset (for example the real E / eBacco architecture) and apply it. Edits are saved in this browser only.</p>
    <textarea id="dataText" spellcheck="false" aria-label="Dataset JSON">${esc(JSON.stringify(S.data, null, 1))}</textarea>
    ${msg ? `<div class="${msg.ok ? 'chip ok' : 'err'}" style="margin-top:6px">${esc(msg.t)}</div>` : ''}
    <div class="btnrow">
      <button class="btn primary" data-act="copyData">Copy JSON</button>
      <button class="btn" data-act="applyData">Apply pasted JSON</button>
      <label class="btn">Load .json file<input type="file" id="dataFile" accept=".json,application/json" hidden></label>
      <span style="flex:1"></span>
      ${S.confirmReset ? `<span class="help" style="margin:0">Discard all local edits?</span><button class="btn danger" data-act="doReset">Discard &amp; reset</button>` : `<button class="btn danger" data-act="askReset">Reset to placeholder</button>`}
    </div></div>`;
  m.hidden = false;
}
function applyDataset(obj){
  if (!obj || !Array.isArray(obj.components) || !Array.isArray(obj.connections)) throw new Error('The JSON needs at least "components" and "connections" arrays.');
  S.data = normalise(obj); S.sel = null; S.focus = null; S.hl = null; S.edit = null;
  S.zonesOn = new Set(S.data.zones.map(z => z.id));
  save(); reindex(); renderAll(); fit();
}

// ---------------------------------------------------------------------------
// events
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act; const L = S.layers;
  if (t.tagName === 'A') e.preventDefault();
  switch (a){
    case 'view': S.view = t.dataset.v; renderTabs(); renderView(); if (S.view === 'arch') renderCanvas(); break;
    case 'solo': {
      const v = t.dataset.v;
      if (v === 'all'){ L.power = L.ground = L.cansig = true; L.can = L.signal = true; }
      else { L.power = v === 'power'; L.ground = v === 'ground'; L.cansig = v === 'cansig'; if (v === 'cansig'){ L.can = true; L.signal = true; } }
      renderLeft(); renderCanvas(); renderStatus(); break; }
    case 'detail': S.detail = t.dataset.v; renderLeft(); renderCanvas(); renderStatus(); break;
    case 'zoneMode': S.zoneMode = t.dataset.v; renderLeft(); renderCanvas(); break;
    case 'zonesAll': S.data.zones.forEach(z => S.zonesOn.add(z.id)); renderLeft(); renderCanvas(); break;
    case 'zonesNone': S.zonesOn.clear(); renderLeft(); renderCanvas(); break;
    case 'soloZone': S.zonesOn = new Set([t.dataset.id]); S.view = 'arch'; renderLeft(); renderView(); renderCanvas(); break;
    case 'pick': select(t.dataset.t, t.dataset.id, {locate:true}); if (t.closest('#results')){ S.search = ''; renderLeft(); } break;
    case 'pickWarn': if (t.dataset.t) select(t.dataset.t, t.dataset.id, {locate:true}); break;
    case 'focus': {
      const id = S.sel?.id; const mode = t.dataset.v;
      if (S.focus?.id === id && S.focus.mode === mode) S.focus = null;
      else S.focus = {id, mode, depth:S.focus?.depth || 1};
      S.hl = null; renderAll(); if (S.focus) fitComps([...neighbourhood(id, mode === 'isolate' ? S.focus.depth : 1)]); break; }
    case 'depth': S.focus.depth = +t.dataset.v; renderCanvas(); fitComps([...neighbourhood(S.focus.id, S.focus.depth)]); break;
    case 'clearFocus': S.focus = null; renderAll(); break;
    case 'clearHl': S.hl = null; if (S.sel?.type === 'harness') S.sel = null; renderAll(); break;
    case 'showHarness': showHarness(t.dataset.id, true); break;
    case 'hlZonePair': {
      const A = t.dataset.a, B = t.dataset.b;
      const ws = S.data.connections.filter(w => { const za = ix.comp.get(w.from)?.zone, zb = ix.comp.get(w.to)?.zone; return (za === A && zb === B) || (za === B && zb === A); });
      hlConns(A === B ? `wiring inside ${zoneName(A)}` : `${zoneName(A)} ↔ ${zoneName(B)}`, ws); break; }
    case 'hlConnector': { const ws = (ix.byConnector.get(t.dataset.id) || []); hlConns(connLabel(t.dataset.id), ws); break; }
    case 'draftFromGroup': {
      const A = t.dataset.a, B = t.dataset.b;
      const ws = S.data.connections.filter(w => !w.harness && (() => { const za = ix.comp.get(w.from)?.zone, zb = ix.comp.get(w.to)?.zone; return (za === A && zb === B) || (za === B && zb === A); })());
      S.edit = {type:'harness', id:null, seed:{name:`${zoneName(A)} ↔ ${zoneName(B)} (draft)`, type:'branched', status:'Draft', connB:[], notes:'Drafted from Harness Analysis consolidation candidate — review before use.'}, seedConns:ws.map(w => w.id)};
      openRightOnNarrow(); renderRight(); break; }
    case 'zoomIn': zoomAt(1.25); break;
    case 'zoomOut': zoomAt(0.8); break;
    case 'fit': fit(); break;
    case 'toggleLock': S.locked = !S.locked; t.textContent = S.locked ? 'Layout locked' : 'Layout unlocked — drag units'; t.classList.toggle('on', !S.locked); break;
    case 'toggleLeft': document.body.classList.toggle('show-left'); document.body.classList.remove('show-right'); break;
    case 'toggleRight': document.body.classList.toggle('show-right'); document.body.classList.remove('show-left'); break;
    case 'newComp': S.edit = {type:'comp', id:null, seed:{category:'ECU', zone:S.sel?.type === 'zone' ? S.sel.id : S.data.zones[0]?.id, can:false}}; openRightOnNarrow(); renderRight(); break;
    case 'newConn': S.edit = {type:'conn', id:null}; openRightOnNarrow(); renderRight(); break;
    case 'newConnFrom': S.edit = {type:'conn', id:null, seed:{from:S.sel.id, layer:'signal', vclass:'LV', wires:1, via:[]}}; renderRight(); break;
    case 'newHarness': S.edit = {type:'harness', id:null}; openRightOnNarrow(); renderRight(); break;
    case 'newConnector': S.edit = {type:'connector', id:null, seed:{component:S.sel.id}}; renderRight(); break;
    case 'editComp': S.edit = {type:'comp', id:S.sel.id}; renderRight(); break;
    case 'editConn': S.edit = {type:'conn', id:S.sel.id}; renderRight(); break;
    case 'editHarness': S.edit = {type:'harness', id:S.sel.id}; renderRight(); break;
    case 'editConnector': S.edit = {type:'connector', id:S.sel.id}; renderRight(); break;
    case 'saveEdit': e.preventDefault(); saveEdit(); break;
    case 'cancelEdit': S.edit = null; renderRight(); break;
    case 'askDelete': S.confirm = S.sel.type + ':' + S.sel.id; renderRight(); break;
    case 'cancelDelete': S.confirm = null; renderRight(); break;
    case 'doDelete': doDelete(); break;
    case 'dataModal': S.confirmReset = false; openDataModal(); break;
    case 'closeModal': $('#modal').hidden = true; break;
    case 'copyData': {
      const ta = $('#dataText');
      const done = ok => { if (!ok){ ta.focus(); ta.select(); } openDataModal({ok:true, t: ok ? 'Copied to clipboard.' : 'Text selected — press Ctrl/⌘+C to copy.'}); };
      try { navigator.clipboard.writeText(ta.value).then(() => done(true), () => done(false)); } catch(err){ done(false); }
      break; }
    case 'applyData': try { applyDataset(JSON.parse($('#dataText').value)); openDataModal({ok:true, t:'Dataset applied and saved in this browser.'}); } catch(err){ openDataModal({ok:false, t:'Could not apply: ' + err.message}); } break;
    case 'askReset': S.confirmReset = true; openDataModal(); break;
    case 'doReset': try { localStorage.removeItem(STORE_KEY); } catch(err){} S.confirmReset = false; applyDataset(clone(S.placeholder)); try { localStorage.removeItem(STORE_KEY); } catch(err){} S.source = 'placeholder'; renderStatus(); openDataModal({ok:true, t:'Placeholder dataset restored.'}); break;
  }
});
document.addEventListener('change', e => {
  const t = e.target, L = S.layers;
  if (t.id === 'ly-power'){ L.power = t.checked; }
  else if (t.id === 'ly-ground'){ L.ground = t.checked; }
  else if (t.id === 'ly-cansig'){ L.cansig = t.checked; }
  else if (t.id === 'ly-can'){ L.can = t.checked; }
  else if (t.id === 'ly-signal'){ L.signal = t.checked; }
  else if (t.id === 'opt-labels'){ S.labels = t.checked; renderCanvas(); return; }
  else if (t.dataset.zonecb){ t.checked ? S.zonesOn.add(t.dataset.zonecb) : S.zonesOn.delete(t.dataset.zonecb); renderCanvas(); return; }
  else if (t.id === 'f-from' || t.id === 'f-to'){
    const tgt = document.getElementById(t.id + 'Conn'); tgt.innerHTML = opts(connOptsFor(t.value), null, '(not specified)'); return;
  }
  else if (t.id === 'tf-type' || t.id === 'tf-status' || t.id === 'tf-layer'){ S.tfilter[t.id.slice(3)] = t.value; renderTable(); return; }
  else if (t.id === 'dataFile'){
    const f = t.files?.[0]; if (!f) return;
    const rd = new FileReader(); rd.onload = () => { try { applyDataset(JSON.parse(rd.result)); openDataModal({ok:true, t:`Loaded ${f.name}.`}); } catch(err){ openDataModal({ok:false, t:'Could not load: ' + err.message}); } }; rd.readAsText(f); return;
  }
  else return;
  renderLeft(); renderCanvas(); renderStatus();
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q'){
    S.search = t.value; const pos = t.selectionStart; renderLeft();
    const q = $('#q'); q.focus(); q.setSelectionRange(pos, pos);
    // immediate locate: exact reference / harness ID match
    const v = S.search.trim().toLowerCase();
    const c = S.data.components.find(c => (c.ref || '').toLowerCase() === v);
    const h = S.data.harnesses.find(h => h.id.toLowerCase() === v);
    if (c){ S.sel = {type:'comp', id:c.id}; S.view = 'arch'; renderTabs(); renderView(); centerOn(c.x + NW/2, c.y + NH/2, 0.9); renderCanvas(); renderRight(); }
    else if (h){ const keep = S.search; showHarness(h.id, true); S.search = keep; renderLeft(); const q2 = $('#q'); q2.focus(); q2.setSelectionRange(pos, pos); }
  }
  if (t.id === 'tf-q'){ S.tfilter.q = t.value; const pos = t.selectionStart; renderTable(); const q = $('#tf-q'); q.focus(); q.setSelectionRange(pos, pos); }
});
document.addEventListener('keydown', e => {
  if (e.target.closest('input,textarea,select')){
    if (e.target.id === 'q' && e.key === 'Enter'){ const r = searchResults(S.search)[0]; if (r){ S.search = ''; select(r.t, r.id, {locate:true}); } }
    if (e.key === 'Escape') e.target.blur();
    return;
  }
  const L = S.layers;
  if (e.key === '1'){ L.power = true; L.ground = false; L.cansig = false; }
  else if (e.key === '2'){ L.power = false; L.ground = true; L.cansig = false; }
  else if (e.key === '3'){ L.power = false; L.ground = false; L.cansig = true; L.can = L.signal = true; }
  else if (e.key === '0'){ L.power = L.ground = L.cansig = L.can = L.signal = true; }
  else if (e.key === 'f' || e.key === 'F'){ fit(); return; }
  else if (e.key === '/'){ e.preventDefault(); $('#q')?.focus(); return; }
  else if (e.key === 'Escape'){ S.focus = null; S.hl = null; $('#modal').hidden = true; renderAll(); return; }
  else return;
  renderLeft(); renderCanvas(); renderStatus();
});
document.addEventListener('submit', e => { e.preventDefault(); saveEdit(); });
document.addEventListener('click', e => { const th = e.target.closest('th[data-sort]'); if (!th) return; const k = th.dataset.sort; S.tsort = {key:k, dir:S.tsort.key === k ? -S.tsort.dir : 1}; renderTable(); });
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') e.target.hidden = true; });

// canvas pointer handling: pan, select, drag (when unlocked), wheel zoom
const svg = $('#svg'); let drag = null, raf = 0;
svg.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  const node = e.target.closest('[data-node]'), conn = e.target.closest('[data-conn]'), xk = e.target.closest('[data-connector]'), zl = e.target.closest('[data-zone]');
  const c = node ? ix.comp.get(node.dataset.node) : null;
  drag = {x:e.clientX, y:e.clientY, tx:S.tx, ty:S.ty, node:c, ox:c?.x, oy:c?.y, conn:conn?.dataset.conn, xk:xk?.dataset.connector, zone:zl?.dataset.zone, moved:false};
  svg.setPointerCapture(e.pointerId);
});
svg.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved && Math.hypot(dx, dy) < 4) return;
  drag.moved = true;
  if (drag.node && !S.locked){
    drag.node.x = Math.round((drag.ox + dx/S.k)/10)*10; drag.node.y = Math.round((drag.oy + dy/S.k)/10)*10;
    if (!raf) raf = requestAnimationFrame(() => { raf = 0; renderCanvas(); });
  } else {
    svg.classList.add('panning'); S.tx = drag.tx + dx; S.ty = drag.ty + dy; applyTransform();
  }
});
svg.addEventListener('pointerup', () => {
  if (!drag) return; const D = drag; drag = null; svg.classList.remove('panning');
  if (D.moved){ if (D.node && !S.locked){ save(); } return; }
  if (D.node) select('comp', D.node.id);
  else if (D.conn) select('conn', D.conn);
  else if (D.xk) select('connector', D.xk);
  else if (D.zone) select('zone', D.zone);
  else if (S.sel && S.sel.type !== 'harness'){ S.sel = null; S.edit = null; renderRight(); renderCanvas(); }
});
svg.addEventListener('pointercancel', () => { drag = null; svg.classList.remove('panning'); });
function zoomAt(f, cx, cy){
  const r = svg.getBoundingClientRect(); if (cx == null){ cx = r.width/2; cy = r.height/2; }
  const k = Math.max(0.15, Math.min(4, S.k*f)); const wx = (cx - S.tx)/S.k, wy = (cy - S.ty)/S.k;
  const crossed = (S.k < 0.8) !== (k < 0.8);
  S.k = k; S.tx = cx - wx*k; S.ty = cy - wy*k; applyTransform();
  if (crossed && S.labels) renderCanvas();
}
svg.addEventListener('wheel', e => { e.preventDefault(); const r = svg.getBoundingClientRect(); zoomAt(Math.exp(-e.deltaY*0.0015), e.clientX - r.left, e.clientY - r.top); }, {passive:false});
let rsz; window.addEventListener('resize', () => { clearTimeout(rsz); rsz = setTimeout(fit, 120); });

// ---------------------------------------------------------------------------
// boot
loadData(); reindex(); renderAll();
requestAnimationFrame(fit);
})();
</script>
