<title>E — Electrical Architecture Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: quiet workbench — slim tool rail left, dotted canvas centre, inspector slides in only when something is selected.
   Four layer colours, always paired with a distinct weight + dash pattern. */
:root{
  --bg:#f6f6f3; --panel:#ffffff; --canvas:#f6f6f3; --dot:#d9d9d2;
  --ink:#141513; --muted:#6b6e67; --faint:#9a9d95; --line:#e4e4de; --line-2:#c9cac3;
  --accent:#00647f; --accent-soft:rgba(0,100,127,.09);
  --pwr:#b3261e; --gnd:#3f413c; --can:#0a5ec2; --sig:#7a3a9e;
  --warn:#7a5b00; --warn-bg:#f6edc8; --ok:#0d7a34;
  --sans:"IBM Plex Sans","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141512; --panel:#1b1c18; --canvas:#141512; --dot:#2c2e28;
  --ink:#f3f2ec; --muted:#a3a69b; --faint:#6f726a; --line:#2b2d27; --line-2:#3d3f38;
  --accent:#6fc3e0; --accent-soft:rgba(111,195,224,.12);
  --pwr:#ef7d74; --gnd:#c8cac4; --can:#6fa8ff; --sig:#c99be6;
  --warn:#edcb3c; --warn-bg:#36301a; --ok:#5fb98a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141512; --panel:#1b1c18; --canvas:#141512; --dot:#2c2e28;
  --ink:#f3f2ec; --muted:#a3a69b; --faint:#6f726a; --line:#2b2d27; --line-2:#3d3f38;
  --accent:#6fc3e0; --accent-soft:rgba(111,195,224,.12);
  --pwr:#ef7d74; --gnd:#c8cac4; --can:#6fa8ff; --sig:#c99be6;
  --warn:#edcb3c; --warn-bg:#36301a; --ok:#5fb98a; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:13px/1.45 var(--sans);overflow:hidden}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
a{color:var(--accent)}
.mono{font-family:var(--mono)}

.app{height:100%;display:grid;grid-template-rows:44px minmax(0,1fr) 26px;grid-template-columns:232px minmax(0,1fr) 0;
  grid-template-areas:"top top top" "left main right" "status status status"}
.app.insp{grid-template-columns:232px minmax(0,1fr) 330px}

/* top */
.top{grid-area:top;display:flex;align-items:center;gap:18px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--panel);min-width:0}
.brand{display:flex;align-items:center;gap:10px;flex:none;font-weight:600;font-size:13.5px}
.mark{width:24px;height:24px;display:grid;place-items:center;background:var(--ink);color:var(--bg);font:600 14px var(--mono)}
.tabs{display:flex;gap:2px;align-self:stretch;overflow-x:auto;min-width:0}
.tab{border:0;background:none;padding:0 10px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-size:12.5px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tab .n{font:11px var(--mono);color:var(--faint);margin-left:4px}
.tab .n.w{color:var(--warn)}
.top .sp{flex:1}
.menu{position:relative}
.menu .pop{position:absolute;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--line-2);display:flex;flex-direction:column;min-width:150px;z-index:40;box-shadow:0 6px 20px rgba(0,0,0,.08)}
.menu .pop button{border:0;background:none;text-align:left;padding:7px 12px}
.menu .pop button:hover{background:var(--accent-soft)}
.btn{border:1px solid var(--line-2);background:var(--panel);padding:3px 9px;font-size:12px;border-radius:3px;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger{color:var(--pwr)}
.btn.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.ghost{border:0;background:none;color:var(--muted);padding:2px 4px;font-size:12px}
.ghost:hover{color:var(--ink)}
.narrow-only{display:none}

/* left rail */
.left{grid-area:left;border-right:1px solid var(--line);background:var(--panel);overflow:auto;min-height:0}
.sec{padding:12px 14px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.eb{font:600 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
.eb .ghost{font:11px var(--sans);letter-spacing:0;text-transform:none}
.inp{width:100%;padding:6px 8px;border:1px solid var(--line-2);background:var(--bg);border-radius:3px;font-size:12.5px}
.results{margin-top:6px;border:1px solid var(--line);max-height:240px;overflow:auto}
.results button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:5px 8px;font-size:12px}
.results button:hover,.results button.act{background:var(--accent-soft)}
.results .k{font:10px var(--mono);color:var(--faint);text-transform:uppercase;margin-right:6px}
.results .empty{padding:6px 8px;color:var(--muted);font-size:12px}
.layer{display:grid;grid-template-columns:30px 1fr auto auto;align-items:center;gap:8px;padding:5px 0}
.layer .nm{font:600 11.5px var(--mono);letter-spacing:.04em}
.layer .c{font:11px var(--mono);color:var(--faint)}
.layer.off .nm,.layer.off svg{opacity:.35}
.solo{font:600 10px var(--mono);letter-spacing:.06em;border:1px solid var(--line-2);background:none;padding:1px 6px;border-radius:2px;color:var(--muted)}
.solo:hover{border-color:var(--ink);color:var(--ink)}
.solo.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.sw{appearance:none;width:26px;height:14px;border-radius:7px;background:var(--line-2);position:relative;margin:0;cursor:pointer}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;background:var(--panel);transition:left .12s}
.sw:checked{background:var(--ink)}
.sw:checked::after{left:14px}
.subl{display:flex;gap:12px;padding:0 0 4px 38px;font-size:12px;color:var(--muted)}
.subl label{display:flex;gap:5px;align-items:center}
.seg{display:inline-grid;grid-auto-flow:column;border:1px solid var(--line-2);border-radius:3px;overflow:hidden}
.seg button{border:0;background:none;padding:3px 9px;font-size:12px;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--bg)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:3px 0;font-size:12.5px}
.zl label{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:3px 0;font-size:12.5px}
.zl .c{font:11px var(--mono);color:var(--faint)}
.help{font-size:11.5px;color:var(--muted);margin:6px 0 0}
.addz{display:flex;gap:6px;margin-top:8px}

/* main */
.main{grid-area:main;position:relative;min-width:0;min-height:0;background:var(--canvas)}
.view{position:absolute;inset:0;overflow:auto}
#canvasView{overflow:hidden}
#svg{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
#svg.panning{cursor:grabbing}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;align-items:center;background:var(--panel);border:1px solid var(--line-2);border-radius:3px}
.zoom button{border:0;background:none;padding:4px 9px;color:var(--muted)}
.zoom button:hover{color:var(--ink)}
.zoom span{font:11px var(--mono);min-width:40px;text-align:center;color:var(--muted)}
.zoom .sepv{width:1px;min-width:0;align-self:stretch;background:var(--line)}
.banner{position:absolute;left:12px;bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line-2);border-left:3px solid var(--accent);padding:5px 10px;font-size:12px;max-width:calc(100% - 260px)}
.banner b{font-family:var(--mono);font-weight:600}

/* svg */
.zone rect{fill:none;stroke:var(--line-2);stroke-dasharray:4 4}
.zone text{font:600 10px var(--mono);fill:var(--faint);letter-spacing:.1em;cursor:pointer}
.node{cursor:pointer}
.node .nb{fill:var(--panel);stroke:var(--line-2);stroke-width:1}
.node .nref{font:600 11px var(--mono);fill:var(--ink)}
.node .ncat{font:9.5px var(--mono);fill:var(--faint)}
.node .nname{font:11px var(--sans);fill:var(--muted)}
.node.bus .nb{stroke:var(--ink);stroke-width:1.4}
.node.fus .nb{stroke-dasharray:3 2}
.node .noref{fill:var(--pwr)}
.node:hover .nb{stroke:var(--ink)}
.node.sel .nb{stroke:var(--accent);stroke-width:2.4}
.node.dim{opacity:.15}
.node .wd{fill:var(--warn)}
path{fill:none}
.e{stroke-linejoin:round}
.e-power{stroke:var(--pwr)}
.e-power.high{stroke-width:3.6}
.e-power.low{stroke-width:1.8}
.e-ground{stroke:var(--gnd);stroke-width:1.8;stroke-dasharray:8 4}
.e-can{stroke:var(--can);stroke-width:4}
.e-can-in{stroke:var(--canvas);stroke-width:1.4}
.e-signal{stroke:var(--sig);stroke-width:1.5;stroke-dasharray:1.5 3;stroke-linecap:round}
.edge.dim{opacity:.07}
.edge.sel .glow,.edge.hl .glow{stroke:var(--accent);stroke-opacity:.22;stroke-width:11}
.hit{stroke:transparent;stroke-width:11;pointer-events:stroke;cursor:pointer}
.el{font:9.5px var(--mono);paint-order:stroke;stroke:var(--canvas);stroke-width:3.5px;stroke-linejoin:round;pointer-events:none}
.el.power{fill:var(--pwr)} .el.ground{fill:var(--gnd)} .el.can{fill:var(--can)} .el.signal{fill:var(--sig)}
.ctag rect{fill:var(--panel);stroke:var(--ink);stroke-width:.8}
.ctag text{font:600 8.5px var(--mono);fill:var(--ink)}
.xconn{cursor:pointer}
.xconn rect{fill:var(--panel);stroke:var(--ink);stroke-width:1.2}
.xconn .xi{stroke:var(--ink);stroke-width:.8}
.xconn text{font:600 9.5px var(--mono);fill:var(--ink)}
.xconn.sel rect{stroke:var(--accent);stroke-width:2.2}
.xconn.dim{opacity:.2}

/* pages */
.page{padding:20px 22px 40px;max-width:1300px}
.lede{color:var(--muted);margin:0 0 16px;max-width:78ch}
.stats{display:flex;flex-wrap:wrap;gap:28px;margin-bottom:16px}
.stat .v{font:600 20px var(--mono);font-variant-numeric:tabular-nums;line-height:1.1}
.stat .l{font-size:11.5px;color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;align-items:center}
.filters input,.filters select{padding:4px 7px;border:1px solid var(--line-2);background:var(--panel);border-radius:3px;font-size:12px}
.tw{overflow:auto;border:1px solid var(--line);background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:12px}
th{position:sticky;top:0;background:var(--panel);text-align:left;font:600 10.5px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--faint);padding:7px 9px;border-bottom:1px solid var(--line-2);white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:var(--ink)}
td{padding:6px 9px;border-bottom:1px solid var(--line);vertical-align:top}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
td.id{font-family:var(--mono);font-weight:600;white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover td,tbody tr.act td{background:var(--accent-soft)}
.dash{color:var(--faint)}
.tbd{color:var(--faint);font-style:italic}
.chip{display:inline-block;font:10.5px var(--mono);padding:0 6px;border:1px solid var(--line-2);border-radius:2px;white-space:nowrap;color:var(--muted)}
.chip.ok{border-color:var(--ok);color:var(--ok)}
.chip.dr{border-style:dashed}
.chip.ph{border-color:var(--warn);color:var(--warn)}
button.chip{background:none;cursor:pointer}
.list{display:flex;flex-direction:column;gap:10px;max-width:860px}
.item{border:1px solid var(--line);background:var(--panel);padding:12px 14px}
.item h3{font-size:13px;margin:0 0 4px;font-weight:600}
.item .meta{font:11px var(--mono);color:var(--muted)}
.item ul{margin:8px 0 0;padding-left:16px;font-size:12px}
h3.sh{font:600 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:24px 0 10px}
.empty{color:var(--muted);font-size:12.5px}
.matrix td,.matrix th{text-align:center;padding:5px 7px;cursor:default}
.matrix td.cell{cursor:pointer;font-family:var(--mono)}
.matrix td.cell:hover{outline:2px solid var(--accent);outline-offset:-2px}
.wg{margin-bottom:16px;max-width:900px}
.wg h3{font-size:12.5px;font-weight:600;margin:0 0 6px;display:flex;gap:8px;align-items:center}
.wi{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:6px 2px;font-size:12.5px}
button.wi:hover{background:var(--accent-soft)}
.wi .go{font:11px var(--mono);color:var(--accent)}
.wi.info{color:var(--muted)}

/* inspector */
.right{grid-area:right;border-left:1px solid var(--line);background:var(--panel);overflow:auto;min-height:0}
.ih{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.iref{font:600 18px var(--mono);line-height:1.15;word-break:break-all}
.iname{font-size:13px;color:var(--muted);margin-top:1px}
.kv{display:grid;grid-template-columns:96px 1fr;gap:3px 10px;font-size:12.5px;margin:12px 0 0}
.kv dt{color:var(--faint);font-size:11.5px;padding-top:1px}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.sub{font:600 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:16px 0 4px;display:flex;justify-content:space-between}
.clist{display:flex;flex-direction:column}
.ci{display:grid;grid-template-columns:22px 1fr;gap:0 8px;align-items:center;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:5px 0;font-size:12px}
.ci:hover{background:var(--accent-soft)}
.ci .to{font-family:var(--mono);font-weight:600}
.ci .sg{grid-column:2;color:var(--muted);font-size:11.5px}
.note{background:var(--warn-bg);color:var(--ink);padding:5px 9px;font-size:12px;margin:4px 0}
.confirm{border:1px solid var(--pwr);padding:8px 10px;margin-top:10px;font-size:12px}
.form{display:flex;flex-direction:column;gap:9px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--muted)}
.form label.ck{flex-direction:row;align-items:center;gap:8px;font-size:12.5px;color:var(--ink)}
.form input[type=text],.form input[type=number],.form select,.form textarea{padding:5px 7px;border:1px solid var(--line-2);background:var(--bg);border-radius:3px;font-size:12.5px;color:var(--ink);width:100%}
.form textarea{min-height:52px;resize:vertical}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form .multi{border:1px solid var(--line-2);background:var(--bg);max-height:200px;overflow:auto;padding:4px 6px;display:flex;flex-direction:column;gap:2px}
.form .multi label{flex-direction:row;align-items:flex-start;gap:6px;font-size:12px;color:var(--ink)}
.form .multi .ex{color:var(--muted)}
.err{color:var(--pwr);font-size:12px}

/* status */
.status{grid-area:status;display:flex;gap:16px;align-items:center;padding:0 14px;border-top:1px solid var(--line);background:var(--panel);font:11px var(--mono);color:var(--muted);overflow-x:auto;white-space:nowrap}
.status b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.status .w b{color:var(--warn)}
.status .sp{flex:1}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.3);display:grid;place-items:center;z-index:50;padding:16px}
.modal .box{background:var(--panel);border:1px solid var(--line-2);width:min(760px,100%);max-height:100%;overflow:auto;padding:16px}
.modal textarea{width:100%;min-height:300px;font:11px var(--mono);border:1px solid var(--line-2);background:var(--bg);padding:8px;color:var(--ink)}

@media (max-width:900px){
  .app,.app.insp{grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "main" "status"}
  .left,.right{position:fixed;top:44px;bottom:26px;width:min(330px,92vw);z-index:30;display:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.2)}
  .left{left:0}.right{right:0}
  body.show-left .left,body.show-right .right{display:block}
  .narrow-only{display:inline-flex}
  .brand .t{display:none}
  .top{gap:8px;padding:0 8px;overflow:hidden}
  .banner{max-width:calc(100% - 24px);bottom:52px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const H_TYPES = {p2p:'Point-to-point', branched:'Branched', bus:'Bus'};
const H_STATUS = ['Defined','Draft','TBD'];
const NONE = '__none';

const S = {
  data:null, source:'embedded', view:'arch',
  layers:{power:true, ground:true, cansig:true, can:true, signal:true},
  detail:'simple', labels:true, locked:true,
  zonesOn:new Set(), zoneMode:'dim',
  sel:null, focus:null, hl:null, edit:null, confirm:null,
  tx:0, ty:0, k:1, search:'',
  tsort:{key:'id', dir:1}, tfilter:{q:'', type:'', status:''}
};
const ix = {};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const push = (m, k, v) => { if (!m.has(k)) m.set(k, []); m.get(k).push(v); };
const uniq = a => [...new Set(a)];
const tbd = v => (v === null || v === undefined || v === '') ? '<span class="tbd">TBD</span>' : esc(v);
const clone = o => JSON.parse(JSON.stringify(o));
const refOf = id => { const c = ix.comp.get(id); return c ? (c.ref || '(no ref)') : '?' + id; };
const nameOf = id => ix.comp.get(id)?.name || '';
function connLabel(cid){
  if (!cid) return null;
  const k = ix.connector.get(cid); if (!k) return cid + ' (undefined)';
  return k.component ? `${refOf(k.component)} ${k.label}` : k.label;
}
const zoneKey = c => (c.zone && ix.zone.has(c.zone)) ? c.zone : NONE;
const zoneName = id => id === NONE || !id ? 'Not assigned' : (ix.zone.get(id)?.name || id);
const catName = code => S.data.categories[code]?.name || code || '—';
const isBus = c => c.category === 'PDU' || c.category === 'GB';
function dims(c){
  if (c.w && c.h) return {w:c.w, h:c.h};
  if (c.category === 'FUS') return {w:64, h:28};
  return {w:140, h:40};
}

// ---------------------------------------------------------------- data
function loadData(){
  const embedded = JSON.parse(document.getElementById('arch-data').textContent);
  let d = null;
  try { const raw = localStorage.getItem(STORE_KEY); if (raw){ d = JSON.parse(raw); S.source = 'local'; } } catch(e){ d = null; }
  S.embedded = embedded;
  S.data = normalise(d || clone(embedded));
}
function normalise(d){
  d.meta = d.meta || {name:'Architecture'};
  d.categories = d.categories || {};
  for (const k of ['zones','components','connectors','connections','harnesses']) d[k] = Array.isArray(d[k]) ? d[k] : [];
  d.connections.forEach(w => { w.via = Array.isArray(w.via) ? w.via : []; });
  d.harnesses.forEach(h => { h.connB = Array.isArray(h.connB) ? h.connB : (h.connB ? [h.connB] : []); });
  return d;
}
function save(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(S.data)); S.source = 'local'; } catch(e){} }
function commit(){ save(); reindex(); renderAll(); }

function reindex(){
  const d = S.data;
  ix.comp = new Map(d.components.map(c => [c.id, c]));
  ix.connector = new Map(d.connectors.map(c => [c.id, c]));
  ix.zone = new Map(d.zones.map(z => [z.id, z]));
  ix.harness = new Map(d.harnesses.map(h => [h.id, h]));
  ix.wire = new Map(d.connections.map(w => [w.id, w]));
  ix.byComp = new Map(); ix.byHarness = new Map(); ix.byConnector = new Map(); ix.connsOfComp = new Map();
  for (const w of d.connections){
    push(ix.byComp, w.from, w); if (w.to !== w.from) push(ix.byComp, w.to, w);
    if (w.harness) push(ix.byHarness, w.harness, w);
    if (w.fromConn) push(ix.byConnector, w.fromConn, w);
    if (w.toConn && w.toConn !== w.fromConn) push(ix.byConnector, w.toConn, w);
    for (const v of w.via) push(ix.byConnector, v, w);
  }
  for (const k of d.connectors) if (k.component) push(ix.connsOfComp, k.component, k);
  if (!S._zinit){ S.zonesOn = new Set([NONE, ...d.zones.map(z => z.id)]); S._zinit = true; }
  ix.warnings = validate();
  ix.warnByComp = new Map();
  for (const w of ix.warnings) if (w.target?.type === 'comp') push(ix.warnByComp, w.target.id, w);
}

function pinsUsed(cid){
  const ws = (ix.byConnector.get(cid) || []).filter(w => w.fromConn === cid || w.toConn === cid);
  const seen = new Set(); let n = 0, unknown = 0;
  for (const w of ws){
    const key = w.layer === 'can' ? `can|${w.harness || w.id}|${w.signal}` : w.id;
    if (seen.has(key)) continue; seen.add(key);
    if (w.wires == null) unknown++; else n += +w.wires;
  }
  return {n, unknown};
}
const fmtCount = ({n, unknown}) => unknown ? (n ? `${n} + ${unknown} TBD` : 'TBD') : String(n);

function hInfo(h){
  const conns = ix.byHarness.get(h.id) || [];
  const layers = uniq(conns.map(w => w.layer));
  const known = conns.filter(w => w.wires != null).reduce((s, w) => s + (+w.wires), 0);
  const unknown = conns.filter(w => w.wires == null).length;
  const comps = uniq(conns.flatMap(w => [w.from, w.to]));
  let origin = h.connA ? (ix.connector.get(h.connA)?.component || null) : null;
  if (!origin && conns.length){
    const cnt = new Map(); conns.forEach(w => [w.from, w.to].forEach(c => cnt.set(c, (cnt.get(c) || 0) + 1)));
    origin = [...cnt.entries()].sort((a, b) => b[1] - a[1])[0][0];
  }
  const byLayer = {power:0, ground:0, can:0, signal:0};
  conns.forEach(w => byLayer[w.layer] = (byLayer[w.layer] || 0) + 1);
  return {conns, layers, est:{n:known, unknown}, origin, dests:comps.filter(c => c !== origin),
    vias:uniq(conns.flatMap(w => w.via)), signals:uniq(conns.map(w => w.signal).filter(Boolean)), byLayer};
}

// ---------------------------------------------------------------- validation (items to review, not verdicts)
const CHECKS = {
  nopower:'Components without power', noground:'Components without ground', isolated:'Isolated components',
  candisc:'CAN nodes disconnected from the CAN network', dupref:'Duplicate reference IDs',
  unassigned:'Connections without an assigned harness', hnoconn:'Harnesses without defined connectors',
  noref:'Components without a reference code', pins:'Connector pin count exceeded', hempty:'Empty harnesses',
  broken:'Broken references', undefined:'Not yet defined'
};
function validate(){
  const d = S.data, W = [];
  const add = (check, sev, msg, target) => W.push({check, sev, msg, target});
  const refs = new Map();
  for (const c of d.components){
    const lbl = `${c.ref || '(no ref)'}${c.name ? ' · ' + c.name : ''}`;
    if (!c.ref) add('noref', 'review', `“${c.name || c.id}” has no reference code`, {type:'comp', id:c.id});
    else push(refs, c.ref, c);
    const cs = ix.byComp.get(c.id) || [];
    const cat = d.categories[c.category] || {};
    if (!cs.length) add('isolated', 'review', `${lbl} has no connections`, {type:'comp', id:c.id});
    else {
      if ((c.needsPower ?? cat.needsPower) && !cs.some(w => w.layer === 'power')) add('nopower', 'review', `${lbl} has no power connection`, {type:'comp', id:c.id});
      if ((c.needsGround ?? cat.needsGround) && !cs.some(w => w.layer === 'ground')) add('noground', 'review', `${lbl} has no ground connection`, {type:'comp', id:c.id});
    }
  }
  for (const [ref, list] of refs) if (list.length > 1) list.forEach(c => add('dupref', 'review', `${ref} is used by ${list.length} components (“${c.name}”)`, {type:'comp', id:c.id}));
  const adj = new Map();
  for (const w of d.connections) if (w.layer === 'can'){ push(adj, w.from, w.to); push(adj, w.to, w.from); }
  const seen = new Map(); const clusters = [];
  for (const c of d.components){
    if (!adj.has(c.id) || seen.has(c.id)) continue;
    const cl = [], st = [c.id]; seen.set(c.id, clusters.length);
    while (st.length){ const x = st.pop(); cl.push(x); for (const y of adj.get(x) || []) if (!seen.has(y)){ seen.set(y, clusters.length); st.push(y); } }
    clusters.push(cl);
  }
  let main = -1, best = -1;
  clusters.forEach((cl, i) => { const sc = cl.length + (cl.some(id => ix.comp.get(id)?.category === 'VCU') ? 1000 : 0); if (sc > best){ best = sc; main = i; } });
  for (const c of d.components.filter(c => c.can)){
    if (!adj.has(c.id)) add('candisc', 'review', `${c.ref || c.name} is marked as a CAN node but has no CAN connection`, {type:'comp', id:c.id});
    else if (seen.get(c.id) !== main) add('candisc', 'review', `${c.ref || c.name} is on a CAN segment not linked to the main network`, {type:'comp', id:c.id});
  }
  let noConnEnds = 0;
  for (const w of d.connections){
    if (!w.harness) add('unassigned', 'review', `${w.id} ${refOf(w.from)} → ${refOf(w.to)} · ${w.signal || w.layer}`, {type:'conn', id:w.id});
    else if (!ix.harness.has(w.harness)) add('broken', 'review', `${w.id} references harness ${w.harness}, which does not exist`, {type:'conn', id:w.id});
    if (!ix.comp.has(w.from) || !ix.comp.has(w.to)) add('broken', 'review', `${w.id} references a component that does not exist`, {type:'conn', id:w.id});
    for (const [cid, comp] of [[w.fromConn, w.from], [w.toConn, w.to]]){
      if (!cid) noConnEnds++;
      else if (!ix.connector.has(cid)) add('broken', 'review', `${w.id}: connector ${cid} is not defined`, {type:'conn', id:w.id});
      else if (ix.connector.get(cid).component !== comp) add('broken', 'review', `${w.id}: connector ${connLabel(cid)} does not belong to ${refOf(comp)}`, {type:'conn', id:w.id});
    }
  }
  for (const h of d.harnesses){
    if (!h.connA || !h.connB.length) add('hnoconn', 'review', `${h.id} ${h.name}: ${!h.connA && !h.connB.length ? 'no connectors' : (!h.connA ? 'no side A connector' : 'no side B connector')}`, {type:'harness', id:h.id});
    if (!(ix.byHarness.get(h.id) || []).length) add('hempty', 'info', `${h.id} ${h.name} carries no connections`, {type:'harness', id:h.id});
  }
  for (const k of d.connectors){ const u = pinsUsed(k.id); if (k.pins != null && u.n > k.pins) add('pins', 'review', `${connLabel(k.id)}: ${u.n} conductors on a ${k.pins}-pin connector`, {type:'connector', id:k.id}); }
  const tot = d.connections.length;
  if (noConnEnds) add('undefined', 'info', `${noConnEnds} of ${tot*2} connection ends have no connector defined`, null);
  const nw = d.connections.filter(w => w.wires == null).length; if (nw) add('undefined', 'info', `${nw} of ${tot} connections have no wire count`, null);
  const ng = d.connections.filter(w => !w.gauge).length; if (ng) add('undefined', 'info', `${ng} of ${tot} connections have no gauge`, null);
  const nz = d.components.filter(c => zoneKey(c) === NONE).length; if (nz) add('undefined', 'info', `${nz} of ${d.components.length} components have no vehicle zone`, null);
  if (!d.connections.some(w => w.layer === 'can')) add('undefined', 'info', 'No CAN network is defined yet', null);
  return W;
}

// ---------------------------------------------------------------- visibility
function layerOn(w){
  const L = S.layers;
  if (w.layer === 'power') return L.power;
  if (w.layer === 'ground') return L.ground;
  if (w.layer === 'can') return L.cansig && L.can;
  if (w.layer === 'signal') return L.cansig && L.signal;
  return false;
}
function neighbourhood(id, depth){
  const set = new Set([id]); let fr = [id];
  for (let i = 0; i < depth; i++){
    const nx = [];
    for (const x of fr) for (const w of ix.byComp.get(x) || []){ if (!layerOn(w)) continue; for (const y of [w.from, w.to]) if (!set.has(y)){ set.add(y); nx.push(y); } }
    fr = nx;
  }
  return set;
}
function visibility(){
  const comp = new Map(), conn = new Map();
  const F = S.focus && ix.comp.has(S.focus.id) ? S.focus : null;
  const fset = F ? neighbourhood(F.id, F.mode === 'isolate' ? F.depth : 1) : null;
  for (const c of S.data.components){
    let st = S.zonesOn.has(zoneKey(c)) ? 'n' : (S.zoneMode === 'hide' ? 'h' : 'd');
    if (fset) st = fset.has(c.id) ? 'n' : (F.mode === 'isolate' ? 'h' : 'd');
    if (S.hl){ if (S.hl.comps.has(c.id)) st = 'n'; else if (st === 'n') st = 'd'; }
    comp.set(c.id, st);
  }
  for (const w of S.data.connections){
    const a = comp.get(w.from), b = comp.get(w.to);
    if (a === undefined || b === undefined){ conn.set(w.id, 'h'); continue; }
    const inHl = S.hl?.conns.has(w.id);
    let st = 'n';
    if (!layerOn(w) && !inHl) st = 'h';
    else if (a === 'h' || b === 'h') st = 'h';
    else if (F){ if (F.mode === 'isolate') st = (fset.has(w.from) && fset.has(w.to)) ? 'n' : 'h'; else st = (w.from === F.id || w.to === F.id) ? 'n' : 'd'; }
    if (st !== 'h' && S.hl) st = inHl ? 'hl' : 'd';
    if (st === 'n' && !F && !S.hl && a === 'd' && b === 'd') st = S.zoneMode === 'hide' ? 'h' : 'd';
    if (S.sel?.type === 'conn' && S.sel.id === w.id && st !== 'h') st = 'sel';
    conn.set(w.id, st);
  }
  return {comp, conn, fset};
}

// ---------------------------------------------------------------- geometry (orthogonal)
function rectOf(c){ const {w, h} = dims(c); return {x:c.x, y:c.y, w, h, cx:c.x + w/2, cy:c.y + h/2}; }
function sideFor(c, p){
  const R = rectOf(c); const dx = p.x - R.cx, dy = p.y - R.cy;
  if (Math.abs(dx) > R.w/2 + 10) return dx > 0 ? 'r' : 'l';   // prefer horizontal exits when the target is clear to one side
  return dy > 0 ? 'b' : 't';
}
function blockedV(A, B){
  const a = rectOf(A), b = rectOf(B), x = (a.cx + b.cx)/2;
  const y0 = Math.min(a.y + a.h, b.y + b.h), y1 = Math.max(a.y, b.y);
  return S.data.components.some(c => { if (c === A || c === B) return false; const r = rectOf(c); return r.x < x && x < r.x + r.w && r.y < y1 && r.y + r.h > y0; });
}
function xPos(id){ const k = ix.connector.get(id); return (k && !k.component && k.x != null) ? {x:k.x, y:k.y} : null; }
function geometry(wires){
  const groups = new Map(), recs = [];
  for (const w of wires){
    const A = ix.comp.get(w.from), B = ix.comp.get(w.to);
    const vias = S.detail === 'detailed' ? w.via.map(xPos).filter(Boolean) : [];
    const cA = rectOf(A), cB = rectOf(B);
    const tA = vias.length ? vias[0] : {x:cB.cx, y:cB.cy};
    const tB = vias.length ? vias[vias.length - 1] : {x:cA.cx, y:cA.cy};
    const r = {w, A, B, vias, sA:sideFor(A, tA), sB:sideFor(B, tB)};
    // units stacked in one column with another unit in between: leave and enter on the right instead of crossing it
    if (!vias.length && 'tb'.includes(r.sA) && 'tb'.includes(r.sB) && blockedV(A, B)) r.sA = r.sB = 'r';
    recs.push(r);
    push(groups, w.from + '|' + r.sA, {r, end:'A', key:(r.sA === 'l' || r.sA === 'r') ? tA.y : tA.x});
    push(groups, w.to + '|' + r.sB, {r, end:'B', key:(r.sB === 'l' || r.sB === 'r') ? tB.y : tB.x});
  }
  for (const [gk, list] of groups){
    const [cid, side] = gk.split('|'); const R = rectOf(ix.comp.get(cid));
    const vert = side === 'l' || side === 'r';
    const start = vert ? R.y : R.x, len = vert ? R.h : R.w;
    list.sort((a, b) => a.key - b.key || a.r.w.id.localeCompare(b.r.w.id));
    const slotKey = e => S.detail === 'detailed' ? ((e.end === 'A' ? e.r.w.fromConn : e.r.w.toConn) || 'w:' + e.r.w.id + e.end) : e.r.w.id + e.end;
    const slots = uniq(list.map(slotKey));
    let pos;
    if (len >= 100){
      // long sides (bus bars): each port sits opposite its target, at least 14px apart
      const want = slots.map(s => Math.max(start + 8, Math.min(start + len - 8, list.find(e => slotKey(e) === s).key)));
      pos = []; want.forEach((v, i) => pos.push(i ? Math.max(v, pos[i - 1] + 14) : v));
      const over = pos[pos.length - 1] - (start + len - 8); if (over > 0) pos = pos.map(v => v - over);
    } else pos = slots.map((s, i) => start + 6 + (i + 1)/(slots.length + 1)*(len - 12));
    const n = list.length;
    list.forEach((e, i) => {
      const v = pos[slots.indexOf(slotKey(e))];
      const p = side === 'l' ? {x:R.x, y:v} : side === 'r' ? {x:R.x + R.w, y:v} : side === 't' ? {x:v, y:R.y} : {x:v, y:R.y + R.h};
      const lane = Math.max(-4, Math.min(4, i - (n - 1)/2));
      if (e.end === 'A'){ e.r.pA = p; e.r.lA = lane; } else { e.r.pB = p; e.r.lB = lane; }
    });
  }
  for (const r of recs){
    const pts = [r.pA, ...r.vias, r.pB];
    let d = `M${r.pA.x},${r.pA.y}`, lab = null;
    r.len = pts.slice(1).reduce((s, p, i) => s + Math.abs(p.x - pts[i].x) + Math.abs(p.y - pts[i].y), 0);
    for (let i = 0; i < pts.length - 1; i++){
      const seg = route(pts[i], i === 0 ? r.sA : null, pts[i + 1], i === pts.length - 2 ? r.sB : null, (r.lA || 0)*4 + (r.lB || 0)*2);
      d += seg.d; if (!lab) lab = seg.l;
    }
    r.d = d; r.lab = lab;
  }
  return recs;
}
function route(P, sP, Q, sQ, lane){
  const horiz = s => s === 'l' || s === 'r';
  const hP = sP ? horiz(sP) : !horiz(sQ || 't');
  const hQ = sQ ? horiz(sQ) : !hP;
  if (hP && hQ){
    const out = sP === 'r' ? 1 : -1;
    let mx = (P.x + Q.x)/2 + lane;
    if ((Q.x - P.x)*out < 4) mx = P.x + out*(16 + Math.abs(lane));
    if (Math.abs(P.y - Q.y) < 1) return {d:` H${Q.x}`, l:{x:(P.x + Q.x)/2, y:P.y}};
    return {d:` H${mx} V${Q.y} H${Q.x}`, l:{x:mx, y:(P.y + Q.y)/2}};
  }
  if (!hP && !hQ){
    const out = sP === 'b' ? 1 : -1;
    let my = (P.y + Q.y)/2 + lane;
    if (sP && (Q.y - P.y)*out < 4) my = P.y + out*(16 + Math.abs(lane));
    return {d:` V${my} H${Q.x} V${Q.y}`, l:{x:(P.x + Q.x)/2, y:my}};
  }
  if (hP) return {d:` H${Q.x} V${Q.y}`, l:{x:(P.x + Q.x)/2, y:P.y}};
  return {d:` V${Q.y} H${Q.x}`, l:{x:P.x, y:(P.y + Q.y)/2}};
}

// ---------------------------------------------------------------- canvas
function renderCanvas(){
  const d = S.data, V = visibility();
  let s = `<defs><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="var(--dot)"/></pattern></defs>`
    + `<rect x="-3000" y="-3000" width="8000" height="8000" fill="url(#dots)"/>`;
  for (const z of d.zones){
    if (z.x == null || z.w == null) continue;
    s += `<g class="zone"><rect x="${z.x}" y="${z.y}" width="${z.w}" height="${z.h}" rx="6"/><text x="${z.x + 10}" y="${z.y + 16}" data-zone="${esc(z.id)}">${esc(z.name.toUpperCase())}</text></g>`;
  }
  const wires = d.connections.filter(w => V.conn.get(w.id) !== 'h' && ix.comp.has(w.from) && ix.comp.has(w.to));
  const recs = geometry(wires);
  const order = {d:0, n:1, sel:2, hl:2};
  recs.sort((a, b) => order[V.conn.get(a.w.id)] - order[V.conn.get(b.w.id)]);
  let labels = '', tags = '';
  const tagSeen = new Set();
  for (const r of recs){
    const w = r.w, st = V.conn.get(w.id);
    let body = (st === 'hl' || st === 'sel') ? `<path class="glow" d="${r.d}"/>` : '';
    if (w.layer === 'power') body += `<path class="e e-power ${w.duty === 'high' ? 'high' : 'low'}" d="${r.d}"/>`;
    else if (w.layer === 'ground') body += `<path class="e e-ground" d="${r.d}"/>`;
    else if (w.layer === 'can') body += `<path class="e e-can" d="${r.d}"/><path class="e e-can-in" d="${r.d}"/>`;
    else body += `<path class="e e-signal" d="${r.d}"/>`;
    const tip = `${w.id} · ${LAYER_META[w.layer]?.name || w.layer} · ${w.signal || ''}\n${refOf(w.from)} → ${refOf(w.to)} · ${w.harness || 'no harness'}`;
    body += `<path class="hit" data-conn="${esc(w.id)}" d="${r.d}"><title>${esc(tip)}</title></path>`;
    s += `<g class="edge ${st === 'd' ? 'dim' : st}">${body}</g>`;
    const showLab = st !== 'd' && (st === 'hl' || st === 'sel' || (S.labels && S.k >= 0.6 && r.len >= 150));
    if (showLab && r.lab){
      let t = S.detail === 'detailed' && w.harness ? `${w.harness} · ${w.signal || ''}` : (w.signal || LAYER_META[w.layer].short);
      if (t.length > 26) t = t.slice(0, 25) + '…';
      const dy = {power:-4, ground:9, can:20, signal:-4}[w.layer] ?? 0;
      labels += `<text class="el ${w.layer}" x="${r.lab.x + 4}" y="${r.lab.y + dy}">${esc(t)}</text>`;
    }
    if (S.detail === 'detailed' && st !== 'd'){
      for (const [p, cid, side] of [[r.pA, w.fromConn, r.sA], [r.pB, w.toConn, r.sB]]){
        if (!cid) continue;
        const lab = ix.connector.get(cid)?.label || '?';
        const off = {l:[-11, 0], r:[11, 0], t:[0, -8], b:[0, 8]}[side];
        const x = p.x + off[0], y = p.y + off[1];
        const key = cid + '|' + Math.round(x) + '|' + Math.round(y);
        if (tagSeen.has(key)) continue; tagSeen.add(key);
        const tw = Math.max(18, lab.length*6 + 6);
        tags += `<g class="ctag" data-connector="${esc(cid)}"><rect x="${x - tw/2}" y="${y - 6}" width="${tw}" height="12"/><text x="${x}" y="${y + 3}" text-anchor="middle">${esc(lab)}</text></g>`;
      }
    }
  }
  let xs = '';
  if (S.detail === 'detailed'){
    for (const k of d.connectors){
      if (k.component || k.x == null) continue;
      const ws = ix.byConnector.get(k.id) || [];
      const vis = ws.some(w => { const st = V.conn.get(w.id); return st && st !== 'h' && st !== 'd'; });
      const sel = S.sel?.type === 'connector' && S.sel.id === k.id;
      const tw = Math.max(40, k.label.length*7 + 16);
      xs += `<g class="xconn ${vis || sel ? '' : 'dim'} ${sel ? 'sel' : ''}" data-connector="${esc(k.id)}" transform="translate(${k.x},${k.y})"><title>${esc(k.notes || k.label)}</title>`
        + `<rect x="${-tw/2}" y="-10" width="${tw}" height="20"/><path class="xi" d="M${-tw/2 + 5},-10V10M${tw/2 - 5},-10V10"/><text y="3.5" text-anchor="middle">${esc(k.label)}</text></g>`;

    const st = V.comp.get(c.id); if (st === 'h') continue;
    const {w, h} = dims(c);
    const sel = S.sel?.type === 'comp' && S.sel.id === c.id;
    const warns = (ix.warnByComp.get(c.id) || []).length;
    const small = h <= 30;
    const maxCh = Math.floor((w - 14)/6.2);

    const ref = c.ref ? `<text class="nref" x="${small ? w/2 : 8}" y="${small ? h/2 + 4 : 16}" ${small ? 'text-anchor="middle"' : ''}>${esc(c.ref)}</text>` : `<text class="nref noref" x="8" y="16">NO REF</text>`;
    ns += `<g class="node ${isBus(c) ? 'bus' : ''} ${c.category === 'FUS' ? 'fus' : ''} ${st === 'd' ? 'dim' : ''} ${sel ? 'sel' : ''}" data-node="${esc(c.id)}" transform="translate(${c.x},${c.y})">`
      + `<title>${esc(`${c.ref || 'NO REF'} · ${c.name}${warns ? `\n${warns} item(s) to review` : ''}`)}</title>`
      + `<rect class="nb" width="${w}" height="${h}" rx="2"/>` + ref
      + (small ? '' : `<text class="nname" x="8" y="31">${esc(name)}</text>`)
      + (!small && w >= 120 ? `<text class="ncat" x="${w - 8}" y="16" text-anchor="end">${esc(c.category || '')}</text>` : '')
      + (warns ? `<circle class="wd" cx="${w - 1}" cy="1" r="3.5"/>` : '')
      + `</g>`;
  }
  $('#vp').innerHTML = s + ns + xs + tags + labels;

}
function applyTransform(){ $('#vp').setAttribute('transform', `translate(${S.tx},${S.ty}) scale(${S.k})`); $('#zm').textContent = Math.round(S.k*100) + '%'; }
function bounds(cs){

function fitBox(b, pad, maxK){

  S.k = Math.max(0.15, Math.min(maxK, r.width/W, r.height/H));
  S.tx = (r.width - (b.x1 - b.x0)*S.k)/2 - b.x0*S.k; S.ty = (r.height - (b.y1 - b.y0)*S.k)/2 - b.y0*S.k;

}

function centerOn(x, y, minK){ const r = $('#svg').getBoundingClientRect(); if (minK && S.k < minK) S.k = minK; S.tx = r.width/2 - x*S.k; S.ty = r.height/2 - y*S.k; applyTransform(); }

function activeLayerNames(){

function searchResults(q){

  for (const h of d.harnesses) if (m(h.id) || m(h.name)) out.push({t:'harness', id:h.id, k:'Harness', a:h.id, b:h.name, s:ex(h.id) ? 0 : 2});
  for (const k of d.connectors) if (m(k.id) || m(k.label) || m(k.notes)) out.push({t:'connector', id:k.id, k:'Conn', a:connLabel(k.id), b:k.notes || k.family || '', s:ex(k.label) ? 0 : 3});

const fv = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
const fnum = id => { const v = fv(id); return v === '' ? null : Math.max(0, +v); };
const fchecks = name => [...document.querySelectorAll(`input[name="${name}"]:checked`)].map(i => i.value);
function nextId(prefix, list, width){
  let n = 0; for (const x of list){ const m = String(x.id).match(new RegExp('^' + prefix + '(\\d+)$')); if (m) n = Math.max(n, +m[1]); }
  return prefix + String(n + 1).padStart(width, '0');
}
function saveEdit(){
  const E = S.edit, d = S.data;
  if (E.type === 'comp'){
    const name = fv('f-name'); if (!name) return failEdit('Give the component a name.');
    const v = {ref:fv('f-ref'), name, category:fv('f-category'), zone:fv('f-zone') || null, supply:fv('f-supply') || null, can:$('#f-can').checked, notes:fv('f-notes')};
    if (E.id) Object.assign(ix.comp.get(E.id), v);
    else {
      let base = (v.ref || name).toLowerCase().replace(/[^a-z0-9]/g, '') || 'unit', id = base, i = 2;
      while (ix.comp.has(id)) id = base + '_' + i++;
      const b = d.components.length ? bounds(d.components) : {x0:40, y0:40, x1:40, y1:-20};
      const row = d.components.filter(c => c.y >= b.y1 + 40);
      const y0 = row.length ? Math.min(...row.map(c => c.y)) : b.y1 + 60;
      d.components.push({id, ...v, x:Math.round((b.x0 + row.length*190)/10)*10, y:Math.round(y0/10)*10});
      E.id = id;
    }
    S.sel = {type:'comp', id:E.id};
  } else if (E.type === 'conn'){
    const from = fv('f-from'), to = fv('f-to');
    if (!from || !to) return failEdit('Choose both units.');
    const v = {from, fromConn:fv('f-fromConn') || null, to, toConn:fv('f-toConn') || null, layer:fv('f-layer'), duty:fv('f-duty'), signal:fv('f-signal'), kind:fv('f-kind') || null, wires:fnum('f-wires'), gauge:fv('f-gauge') || null, harness:fv('f-harness') || null, via:fchecks('f-via'), notes:fv('f-notes')};
    if (E.id) Object.assign(ix.wire.get(E.id), v);
    else { E.id = nextId('W', d.connections, 3); d.connections.push({id:E.id, ...v}); }
    showLayer(v.layer);
    S.sel = {type:'conn', id:E.id};
  } else if (E.type === 'harness'){
    const name = fv('f-name'); if (!name) return failEdit('Give the harness a name.');
    const v = {name, type:fv('f-type'), status:fv('f-status'), connA:fv('f-connA') || null, connB:fchecks('f-connB'), conductors:fnum('f-conductors'), notes:fv('f-notes')};
    let id = E.id;
    if (id) Object.assign(ix.harness.get(id), v); else { id = nextId('H-', d.harnesses, 3); d.harnesses.push({id, ...v}); }
    const chosen = new Set(fchecks('f-conns'));
    for (const w of d.connections){ if (chosen.has(w.id)) w.harness = id; else if (w.harness === id) w.harness = null; }
    S.sel = {type:'harness', id};
  } else if (E.type === 'connector'){
    const label = fv('f-label'); if (!label) return failEdit('Give the connector a label.');
    const component = fv('f-component') || null;
    const newId = component ? `${component}.${label}` : label;
    if (newId !== E.id && ix.connector.has(newId)) return failEdit(`Connector ${newId} already exists.`);
    const v = {label, component, family:fv('f-family') || null, pins:fnum('f-pins'), class:fv('f-class') || null, notes:fv('f-notes')};
    if (E.id){ Object.assign(ix.connector.get(E.id), v); if (newId !== E.id) renameConnector(E.id, newId); }
    else {
      const k = {id:newId, ...v};
      if (!component && d.components.length){ const b = bounds(d.components); k.x = Math.round((b.x0 + b.x1)/2); k.y = Math.round(b.y1 + 40); }
      d.connectors.push(k);
    }
    S.sel = {type:'connector', id:newId};
  }
  S.edit = null; S.confirm = null; commit();
}
function failEdit(msg){ S.edit.err = msg; renderRight(); }
function renameConnector(oldId, newId){
  ix.connector.get(oldId).id = newId;
  for (const w of S.data.connections){ if (w.fromConn === oldId) w.fromConn = newId; if (w.toConn === oldId) w.toConn = newId; w.via = w.via.map(v => v === oldId ? newId : v); }
  for (const h of S.data.harnesses){ if (h.connA === oldId) h.connA = newId; h.connB = h.connB.map(v => v === oldId ? newId : v); }
}
function doDelete(){
  const i = S.confirm.indexOf(':'), type = S.confirm.slice(0, i), id = S.confirm.slice(i + 1), d = S.data;
  if (type === 'comp'){
    const kids = new Set(d.connectors.filter(k => k.component === id).map(k => k.id));
    d.components = d.components.filter(c => c.id !== id);
    d.connectors = d.connectors.filter(k => k.component !== id);
    d.connections = d.connections.filter(w => w.from !== id && w.to !== id);
    for (const h of d.harnesses){ if (kids.has(h.connA)) h.connA = null; h.connB = h.connB.filter(c => !kids.has(c)); }
    if (S.focus?.id === id) S.focus = null;
  } else if (type === 'harness'){
    d.harnesses = d.harnesses.filter(h => h.id !== id);
    d.connections.forEach(w => { if (w.harness === id) w.harness = null; });
    if (S.hl?.harness === id) S.hl = null;
  } else if (type === 'conn') d.connections = d.connections.filter(w => w.id !== id);
  else if (type === 'connector'){
    d.connectors = d.connectors.filter(k => k.id !== id);
    for (const w of d.connections){ if (w.fromConn === id) w.fromConn = null; if (w.toConn === id) w.toConn = null; w.via = w.via.filter(v => v !== id); }
    for (const h of d.harnesses){ if (h.connA === id) h.connA = null; h.connB = h.connB.filter(c => c !== id); }
  } else if (type === 'zone'){
    d.zones = d.zones.filter(z => z.id !== id);
    d.components.forEach(c => { if (c.zone === id) c.zone = null; });
    S.zonesOn.delete(id);
  }
  S.sel = null; S.confirm = null; commit();
}

// ---------------------------------------------------------------- analysis
function renderAnalysis(){
  const d = S.data;
  const pairs = new Map();
  for (const w of d.connections){
    const a = ix.comp.get(w.from), b = ix.comp.get(w.to); if (!a || !b) continue;
    const za = zoneKey(a), zb = zoneKey(b); if (za === NONE || zb === NONE) continue;
    push(pairs, [za, zb].sort().join('|'), w);
  }
  const opps = [];
  for (const [key, ws] of pairs){
    const [a, b] = key.split('|'); if (a === b) continue;
    const hs = uniq(ws.filter(w => w.harness).map(w => w.harness)), un = ws.filter(w => !w.harness);
    if (ws.length >= 3 && hs.length + un.length >= 2) opps.push({a, b, ws, hs, un, carriers:hs.length + un.length});
  }
  opps.sort((x, y) => y.carriers - x.carriers || y.ws.length - x.ws.length);
  // fan-out: one connector (or, while connectors are undefined, one unit) feeding 3+ units through separate cables
  const fans = [], groups = new Map();
  for (const w of d.connections) for (const [c, k, o] of [[w.from, w.fromConn, w.to], [w.to, w.toConn, w.from]]) push(groups, k || 'unit:' + c, {w, o, c});
  for (const [key, es] of groups){
    const carriers = uniq(es.map(e => e.w.harness || 'U:' + e.w.id)), others = uniq(es.map(e => e.o));
    if (others.length >= 3 && carriers.length >= 3) fans.push({key, es, carriers, others, label:key.startsWith('unit:') ? `${refOf(es[0].c)} ${nameOf(es[0].c)}` : connLabel(key)});
  }
  fans.sort((a, b) => b.carriers.length - a.carriers.length);
  const zoned = d.components.filter(c => zoneKey(c) !== NONE).length;
  const zs = d.zones;
  $('#analysisView').innerHTML = `<div class="page">
    <p class="lede">Prompts for the harness designer. Where separate cables run between the same two areas, or one source feeds many units through separate cables, they may become one harness. Nothing here changes the wiring.</p>
    <h3 class="sh">Consolidation between zones</h3>
    ${!zoned ? `<p class="empty">No unit has a vehicle zone yet. Add zones in the left panel and set them on units to find cables that could share a harness.</p>`
      : opps.length ? `<div class="list">${opps.map(o => `<div class="item"><h3>Potential harness consolidation: ${o.ws.length} connections between ${esc(zoneName(o.a))} and ${esc(zoneName(o.b))}.</h3>
        <div class="meta">${o.carriers} separate carriers · ${uniq(o.ws.map(w => LAYER_META[w.layer].short)).join(' + ')}</div>
        <ul>${o.hs.map(h => `<li><b class="mono">${esc(h)}</b> ${esc(ix.harness.get(h)?.name || '')}</li>`).join('')}${o.un.length ? `<li>${o.un.length} unassigned: ${o.un.map(w => esc(w.id)).join(', ')}</li>` : ''}</ul>
        <div class="acts"><button class="btn on" data-act="hlZonePair" data-a="${esc(o.a)}" data-b="${esc(o.b)}">Show</button>${o.un.length ? `<button class="btn" data-act="draftFromGroup" data-a="${esc(o.a)}" data-b="${esc(o.b)}">Draft harness from ${o.un.length} unassigned</button>` : ''}</div></div>`).join('')}</div>`
      : '<p class="empty">No zone pair has three or more connections spread across separate cables.</p>'}
    <h3 class="sh">Fan-out (branched harness candidates)</h3>
    ${fans.length ? `<div class="list">${fans.map(f => `<div class="item"><h3>${esc(f.label)} feeds ${f.others.length} units through ${f.carriers.length} separate cables.</h3>
      <ul>${f.es.map(e => `<li><span class="mono">${esc(e.w.id)}</span> → ${esc(refOf(e.o))} ${esc(nameOf(e.o))} · ${esc(e.w.signal || '')} · ${e.w.harness ? '<span class="mono">' + esc(e.w.harness) + '</span>' : '<span style="color:var(--warn)">unassigned</span>'}</li>`).join('')}</ul>
      <div class="acts"><button class="btn on" data-act="hlFan" data-id="${esc(f.key)}">Show</button></div></div>`).join('')}</div>` : '<p class="empty">No source feeds three or more units through separate cables.</p>'}
    ${zs.length && zoned ? `<h3 class="sh">Zone-to-zone connections</h3><div class="tw" style="width:max-content;max-width:100%"><table class="matrix"><thead><tr><th></th>${zs.map(z => `<th>${esc(z.name)}</th>`).join('')}</tr></thead><tbody>${zs.map((za, i) => `<tr><th style="text-align:right">${esc(za.name)}</th>${zs.map((zb, j) => { if (j < i) return '<td></td>'; const n = (pairs.get([za.id, zb.id].sort().join('|')) || []).length; return n ? `<td class="cell" data-act="hlZonePair" data-a="${esc(za.id)}" data-b="${esc(zb.id)}">${n}</td>` : '<td class="dash">·</td>'; }).join('')}</tr>`).join('')}</tbody></table></div>` : ''}
  </div>`;
}

// ---------------------------------------------------------------- warnings
function renderWarnings(){
  const W = ix.warnings, groups = new Map(); W.forEach(w => push(groups, w.check, w));
  const review = W.filter(w => w.sev === 'review').length;
  $('#warningsView').innerHTML = `<div class="page">
    <p class="lede">Automatic checks over the data. Each item is something to review, not necessarily an engineering error: often it is simply not defined yet.</p>
    <div class="stats"><div class="stat"><div class="v">${review}</div><div class="l">To review</div></div><div class="stat"><div class="v">${W.length - review}</div><div class="l">Not yet defined</div></div></div>
    ${Object.keys(CHECKS).filter(k => groups.has(k)).map(k => `<div class="wg"><h3>${esc(CHECKS[k])} <span class="chip">${groups.get(k).length}</span></h3>
      ${groups.get(k).map(w => w.target ? `<button class="wi ${w.sev === 'info' ? 'info' : ''}" data-act="pickWarn" data-t="${w.target.type}" data-id="${esc(w.target.id)}"><span>${esc(w.msg)}</span><span class="go">Locate →</span></button>` : `<div class="wi info"><span>${esc(w.msg)}</span></div>`).join('')}</div>`).join('')}
    ${!W.length ? '<p class="empty">Nothing to review.</p>' : ''}
  </div>`;
}

// ---------------------------------------------------------------- chrome
function renderTabs(){
  const W = ix.warnings.filter(w => w.sev === 'review').length;
  const t = [['arch','Architecture',''],['table','Harness List',S.data.harnesses.length],['analysis','Harness Analysis',''],['warnings','Warnings',W]];
  $('#tabs').innerHTML = t.map(([v, l, n]) => `<button class="tab" role="tab" aria-selected="${S.view === v}" data-act="view" data-v="${v}">${l}${n !== '' ? `<span class="n ${v === 'warnings' && n ? 'w' : ''}">${n}</span>` : ''}</button>`).join('');
}
function renderStatus(){
  const d = S.data, W = ix.warnings.filter(w => w.sev === 'review').length;
  $('#status').innerHTML = `<span>Components <b>${d.components.length}</b></span><span>Connections <b>${d.connections.length}</b></span><span>Harnesses <b>${d.harnesses.length}</b></span><span class="w">Warnings <b>${W}</b></span>
    <span class="sp"></span><span>${esc(activeLayerNames() || 'No layers')}</span><span>${esc(d.meta.version || '')}${S.source === 'local' ? ' · local edits' : ''}</span>`;
}
function renderView(){
  const map = {arch:'#canvasView', table:'#tableView', analysis:'#analysisView', warnings:'#warningsView'};
  for (const [k, sel] of Object.entries(map)) $(sel).hidden = S.view !== k;
  if (S.view === 'table') renderTable();
  if (S.view === 'analysis') renderAnalysis();
  if (S.view === 'warnings') renderWarnings();
}
function renderAll(){ renderTabs(); renderLeft(); renderRight(); renderView(); renderCanvas(); renderStatus(); }

// ---------------------------------------------------------------- actions
function showLayer(l){ const L = S.layers; if (l === 'power') L.power = true; else if (l === 'ground') L.ground = true; else { L.cansig = true; L[l] = true; } }
function goArch(){ if (S.view !== 'arch'){ S.view = 'arch'; renderTabs(); renderView(); } }
function select(t, id, locate){
  S.confirm = null; S.edit = null;
  if (t === 'harness'){ showHarness(id, locate); return; }
  S.sel = {type:t, id};
  if (t === 'comp' && S.focus && S.focus.id !== id) S.focus = {...S.focus, id};
  if (t === 'conn'){ const w = ix.wire.get(id); if (w && !layerOn(w)) showLayer(w.layer); }
  if (t === 'connector' && !ix.connector.get(id)?.component) S.detail = 'detailed';
  renderRight();
  if (locate){
    goArch();
    if (t === 'comp'){ const R = rectOf(ix.comp.get(id)); centerOn(R.cx, R.cy, 0.9); }
    else if (t === 'conn'){ const w = ix.wire.get(id); if (w) fitComps([w.from, w.to]); }
    else if (t === 'connector'){ const k = ix.connector.get(id); if (k?.component){ const R = rectOf(ix.comp.get(k.component)); centerOn(R.cx, R.cy, 0.9); } else if (k) centerOn(k.x, k.y, 0.9); }
    else if (t === 'zone'){ const cs = S.data.components.filter(c => c.zone === id).map(c => c.id); if (cs.length) fitComps(cs); }
  }
  openRightOnNarrow(); renderAll();
}
function showHarness(id, locate = true){
  const h = ix.harness.get(id); if (!h) return;
  const conns = ix.byHarness.get(id) || [];
  S.hl = {label:`${id} · ${h.name}`, harness:id, conns:new Set(conns.map(w => w.id)), comps:new Set(conns.flatMap(w => [w.from, w.to]))};
  S.focus = null; S.sel = {type:'harness', id}; S.edit = null; S.confirm = null;
  renderRight();
  if (locate){ goArch(); if (S.hl.comps.size) fitComps([...S.hl.comps]); }
  openRightOnNarrow(); renderAll();
}
function hlConns(label, ws){
  S.hl = {label, conns:new Set(ws.map(w => w.id)), comps:new Set(ws.flatMap(w => [w.from, w.to]))};
  S.focus = null; goArch(); renderAll(); fitComps([...S.hl.comps]);
}
function zonePairConns(A, B){
  return S.data.connections.filter(w => { const a = ix.comp.get(w.from), b = ix.comp.get(w.to); if (!a || !b) return false; const za = zoneKey(a), zb = zoneKey(b); return (za === A && zb === B) || (za === B && zb === A); });
}
function openRightOnNarrow(){ if (matchMedia('(max-width:900px)').matches){ document.body.classList.remove('show-left'); document.body.classList.add('show-right'); } }

function openDataModal(msg){
  const m = $('#modal');
  m.innerHTML = `<div class="box" role="dialog" aria-label="Architecture data">
    <div class="ih" style="margin-bottom:8px"><div class="iref" style="font-size:15px;font-family:var(--sans)">Architecture data</div><button class="ghost" data-act="closeModal" aria-label="Close">✕</button></div>
    <p class="help" style="margin:0 0 8px">The whole architecture as JSON. Copy it to keep your edits, or paste a dataset and apply it. Edits are saved in this browser only.</p>
    <textarea id="dataText" spellcheck="false" aria-label="Dataset JSON">${esc(JSON.stringify(S.data, null, 1))}</textarea>
    ${msg ? `<p class="${msg.ok ? 'help' : 'err'}">${esc(msg.t)}</p>` : ''}
    <div class="acts">
      <button class="btn primary" data-act="copyData">Copy JSON</button><button class="btn" data-act="applyData">Apply pasted JSON</button>
      <label class="btn">Load file<input type="file" id="dataFile" accept=".json,application/json" hidden></label>
      <span style="flex:1"></span>
      ${S.confirmReset ? `<button class="btn danger" data-act="doReset">Discard edits &amp; reset</button>` : `<button class="btn" data-act="askReset">Reset to sketch data</button>`}
    </div></div>`;
  m.hidden = false;
}
function applyDataset(obj){
  if (!obj || !Array.isArray(obj.components) || !Array.isArray(obj.connections)) throw new Error('the JSON needs "components" and "connections" arrays.');
  S.data = normalise(obj); S.sel = S.focus = S.hl = S.edit = null; S._zinit = false;
  save(); reindex(); renderAll(); fit();
}

document.addEventListener('click', e => {
  if (!e.target.closest('#addMenu')) $('#addPop').hidden = true;
  const th = e.target.closest('th[data-sort]');
  if (th){ const k = th.dataset.sort; S.tsort = {key:k, dir:S.tsort.key === k ? -S.tsort.dir : 1}; renderTable(); return; }
  const t = e.target.closest('[data-act]'); if (!t) return;
  if (t.tagName === 'A') e.preventDefault();
  const a = t.dataset.act, L = S.layers;
  switch (a){
    case 'view': S.view = t.dataset.v; renderTabs(); renderView(); if (S.view === 'arch') renderCanvas(); break;
    case 'solo': {
      const v = t.dataset.v;
      if (v === 'all'){ L.power = L.ground = L.cansig = L.can = L.signal = true; }
      else { L.power = v === 'power'; L.ground = v === 'ground'; L.cansig = v === 'cansig'; if (v === 'cansig') L.can = L.signal = true; }
      renderLeft(); renderCanvas(); renderStatus(); break; }
    case 'detail': S.detail = t.dataset.v; renderLeft(); renderCanvas(); break;
    case 'zoneMode': S.zoneMode = t.dataset.v; renderLeft(); renderCanvas(); break;
    case 'zonesAll': S.zonesOn = new Set([NONE, ...S.data.zones.map(z => z.id)]); renderLeft(); renderCanvas(); break;
    case 'zonesNone': S.zonesOn.clear(); renderLeft(); renderCanvas(); break;
    case 'soloZone': S.zonesOn = new Set([t.dataset.id]); goArch(); renderLeft(); renderCanvas(); break;
    case 'addZone': {
      const name = $('#newZone').value.trim(); if (!name){ $('#newZone').focus(); break; }
      let base = name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'zone', id = base, i = 2;
      while (ix.zone.has(id)) id = base + '-' + i++;
      S.data.zones.push({id, name}); S.zonesOn.add(id); commit(); break; }
    case 'pick': if (t.closest('.results')) S.search = ''; select(t.dataset.t, t.dataset.id, true); break;
    case 'pickWarn': select(t.dataset.t, t.dataset.id, true); break;
    case 'focus': {
      const id = S.sel?.id, mode = t.dataset.v;
      S.focus = (S.focus?.id === id && S.focus.mode === mode) ? null : {id, mode, depth:S.focus?.depth || 1};
      S.hl = null; renderAll(); if (S.focus) fitComps([...neighbourhood(id, mode === 'isolate' ? S.focus.depth : 1)]); break; }
    case 'depth': S.focus.depth = +t.dataset.v; renderCanvas(); fitComps([...neighbourhood(S.focus.id, S.focus.depth)]); break;
    case 'clearFocus': S.focus = null; renderAll(); break;
    case 'clearHl': S.hl = null; if (S.sel?.type === 'harness') S.sel = null; renderAll(); break;
    case 'showHarness': showHarness(t.dataset.id, true); break;
    case 'hlZonePair': hlConns(t.dataset.a === t.dataset.b ? `Inside ${zoneName(t.dataset.a)}` : `${zoneName(t.dataset.a)} ↔ ${zoneName(t.dataset.b)}`, zonePairConns(t.dataset.a, t.dataset.b)); break;
    case 'hlFan': {
      const key = t.dataset.id, cid = key.slice(5);
      const ws = key.startsWith('unit:') ? (ix.byComp.get(cid) || []).filter(w => (w.from === cid && !w.fromConn) || (w.to === cid && !w.toConn)) : (ix.byConnector.get(key) || []);
      hlConns(key.startsWith('unit:') ? `${refOf(cid)} fan-out` : connLabel(key), ws); break; }
    case 'draftFromGroup': {
      const ws = zonePairConns(t.dataset.a, t.dataset.b).filter(w => !w.harness);
      S.edit = {type:'harness', id:null, seed:{name:`${zoneName(t.dataset.a)} ↔ ${zoneName(t.dataset.b)}`, type:'branched', status:'Draft', connB:[], notes:'Drafted from Harness Analysis. Review before use.'}, seedConns:ws.map(w => w.id)};
      openRightOnNarrow(); renderRight(); break; }
    case 'zoomIn': zoomAt(1.25); break;
    case 'zoomOut': zoomAt(0.8); break;
    case 'fit': fit(); break;
    case 'toggleLock': S.locked = !S.locked; t.textContent = S.locked ? 'Locked' : 'Unlocked'; t.style.color = S.locked ? '' : 'var(--accent)'; break;
    case 'toggleLeft': document.body.classList.toggle('show-left'); document.body.classList.remove('show-right'); break;
    case 'toggleAdd': $('#addPop').hidden = !$('#addPop').hidden; break;
    case 'closeInsp': S.sel = null; S.edit = null; S.confirm = null; document.body.classList.remove('show-right'); if (S.hl?.harness) S.hl = null; renderAll(); break;
    case 'newComp': $('#addPop').hidden = true; S.edit = {type:'comp', id:null, seed:{category:'ECU', zone:null, can:false}}; openRightOnNarrow(); renderRight(); break;
    case 'newConn': $('#addPop').hidden = true; S.edit = {type:'conn', id:null}; openRightOnNarrow(); renderRight(); break;
    case 'newHarness': $('#addPop').hidden = true; S.edit = {type:'harness', id:null}; openRightOnNarrow(); renderRight(); break;
    case 'newConnector': $('#addPop').hidden = true; S.edit = {type:'connector', id:null, seed:{component:null}}; openRightOnNarrow(); renderRight(); break;
    case 'newConnFrom': S.edit = {type:'conn', id:null, seed:{from:S.sel.id, layer:'power', duty:'low', via:[]}}; renderRight(); break;
    case 'newConnectorOn': S.edit = {type:'connector', id:null, seed:{component:S.sel.id}}; renderRight(); break;
    case 'editComp': S.edit = {type:'comp', id:S.sel.id}; renderRight(); break;
    case 'editConn': S.edit = {type:'conn', id:S.sel.id}; renderRight(); break;
    case 'editHarness': S.edit = {type:'harness', id:S.sel.id}; renderRight(); break;
    case 'editConnector': S.edit = {type:'connector', id:S.sel.id}; renderRight(); break;
    case 'saveEdit': e.preventDefault(); saveEdit(); break;
    case 'cancelEdit': S.edit = null; renderRight(); renderCanvas(); break;
    case 'askDelete': S.confirm = S.sel.type + ':' + S.sel.id; renderRight(); break;
    case 'cancelDelete': S.confirm = null; renderRight(); break;
    case 'doDelete': doDelete(); break;
    case 'dataModal': S.confirmReset = false; openDataModal(); break;
    case 'closeModal': $('#modal').hidden = true; break;
    case 'copyData': {
      const ta = $('#dataText');
      const done = ok => { openDataModal({ok:true, t:ok ? 'Copied.' : 'Select the text and press Ctrl/⌘+C.'}); if (!ok){ const t2 = $('#dataText'); t2.focus(); t2.select(); } };
      try { navigator.clipboard.writeText(ta.value).then(() => done(true), () => done(false)); } catch(err){ done(false); }
      break; }
    case 'applyData': try { applyDataset(JSON.parse($('#dataText').value)); openDataModal({ok:true, t:'Dataset applied.'}); } catch(err){ openDataModal({ok:false, t:'Could not apply: ' + err.message}); } break;
    case 'askReset': S.confirmReset = true; openDataModal(); break;
    case 'doReset': S.confirmReset = false; applyDataset(clone(S.embedded)); try { localStorage.removeItem(STORE_KEY); } catch(err){} S.source = 'embedded'; renderStatus(); openDataModal({ok:true, t:'Sketch data restored.'}); break;
  }
});
document.addEventListener('change', e => {
  const t = e.target, L = S.layers;
  if (t.id === 'ly-power') L.power = t.checked;
  else if (t.id === 'ly-ground') L.ground = t.checked;
  else if (t.id === 'ly-cansig') L.cansig = t.checked;
  else if (t.id === 'ly-can') L.can = t.checked;
  else if (t.id === 'ly-signal') L.signal = t.checked;
  else if (t.id === 'opt-labels'){ S.labels = t.checked; renderCanvas(); return; }
  else if (t.dataset.zonecb){ t.checked ? S.zonesOn.add(t.dataset.zonecb) : S.zonesOn.delete(t.dataset.zonecb); renderCanvas(); return; }
  else if (t.id === 'f-from' || t.id === 'f-to'){ document.getElementById(t.id + 'Conn').innerHTML = opts(connOptsFor(t.value), null, 'Not specified'); return; }
  else if (t.id === 'tf-type' || t.id === 'tf-status'){ S.tfilter[t.id.slice(3)] = t.value; renderTable(); return; }
  else if (t.id === 'dataFile'){
    const f = t.files?.[0]; if (!f) return;
    const rd = new FileReader(); rd.onload = () => { try { applyDataset(JSON.parse(rd.result)); openDataModal({ok:true, t:`Loaded ${f.name}.`}); } catch(err){ openDataModal({ok:false, t:'Could not load: ' + err.message}); } }; rd.readAsText(f); return;
  }
  else return;
  renderLeft(); renderCanvas(); renderStatus();
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q'){
    S.search = t.value; const pos = t.selectionStart; renderLeft(); const q = $('#q'); q.focus(); q.setSelectionRange(pos, pos);
    const v = S.search.trim().toLowerCase();
    const c = S.data.components.find(c => (c.ref || '').toLowerCase() === v);
    const h = S.data.harnesses.find(h => h.id.toLowerCase() === v);
    if (c){ S.sel = {type:'comp', id:c.id}; goArch(); renderRight(); const R = rectOf(c); centerOn(R.cx, R.cy, 0.9); renderCanvas(); }
    else if (h){ showHarness(h.id, true); const q2 = $('#q'); q2.focus(); q2.setSelectionRange(pos, pos); }
  }
  if (t.id === 'tf-q'){ S.tfilter.q = t.value; const pos = t.selectionStart; renderTable(); const q = $('#tf-q'); q.focus(); q.setSelectionRange(pos, pos); }
});
document.addEventListener('keydown', e => {
  if (e.target.closest('input,textarea,select')){
    if (e.target.id === 'q' && e.key === 'Enter'){ const r = searchResults(S.search)[0]; if (r){ S.search = ''; select(r.t, r.id, true); } }
    if (e.target.id === 'newZone' && e.key === 'Enter') $('[data-act=addZone]').click();
    if (e.key === 'Escape') e.target.blur();
    return;
  }
  const L = S.layers;
  if (e.key === '1'){ L.power = true; L.ground = L.cansig = false; }
  else if (e.key === '2'){ L.ground = true; L.power = L.cansig = false; }
  else if (e.key === '3'){ L.cansig = L.can = L.signal = true; L.power = L.ground = false; }
  else if (e.key === '0'){ L.power = L.ground = L.cansig = L.can = L.signal = true; }
  else if (e.key === 'f' || e.key === 'F'){ fit(); return; }
  else if (e.key === '/'){ e.preventDefault(); $('#q')?.focus(); return; }
  else if (e.key === 'Escape'){ S.focus = S.hl = null; $('#modal').hidden = true; renderAll(); return; }
  else return;
  renderLeft(); renderCanvas(); renderStatus();
});
document.addEventListener('submit', e => { e.preventDefault(); saveEdit(); });
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') e.target.hidden = true; });

const svg = $('#svg'); let drag = null, raf = 0;
svg.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  const node = e.target.closest('[data-node]'), conn = e.target.closest('[data-conn]'), xk = e.target.closest('[data-connector]'), zl = e.target.closest('[data-zone]');
  const c = node ? ix.comp.get(node.dataset.node) : null;
  drag = {x:e.clientX, y:e.clientY, tx:S.tx, ty:S.ty, node:c, ox:c?.x, oy:c?.y, conn:conn?.dataset.conn, xk:xk?.dataset.connector, zone:zl?.dataset.zone, moved:false};
  svg.setPointerCapture(e.pointerId);
});
svg.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved && Math.hypot(dx, dy) < 4) return;
  drag.moved = true;
  if (drag.node && !S.locked){
    drag.node.x = Math.round((drag.ox + dx/S.k)/10)*10; drag.node.y = Math.round((drag.oy + dy/S.k)/10)*10;
    if (!raf) raf = requestAnimationFrame(() => { raf = 0; renderCanvas(); });
  } else { svg.classList.add('panning'); S.tx = drag.tx + dx; S.ty = drag.ty + dy; applyTransform(); }
});
svg.addEventListener('pointerup', () => {
  if (!drag) return; const D = drag; drag = null; svg.classList.remove('panning');
  if (D.moved){ if (D.node && !S.locked) save(); return; }
  if (D.node) select('comp', D.node.id);
  else if (D.conn) select('conn', D.conn);
  else if (D.xk) select('connector', D.xk);
  else if (D.zone) select('zone', D.zone);
  else if (S.sel && S.sel.type !== 'harness'){ S.sel = null; S.edit = null; renderRight(); renderCanvas(); }
});
svg.addEventListener('pointercancel', () => { drag = null; svg.classList.remove('panning'); });
function zoomAt(f, cx, cy){
  const r = svg.getBoundingClientRect(); if (cx == null){ cx = r.width/2; cy = r.height/2; }
  const k = Math.max(0.15, Math.min(4, S.k*f)), wx = (cx - S.tx)/S.k, wy = (cy - S.ty)/S.k;
  const crossed = (S.k < 0.6) !== (k < 0.6);
  S.k = k; S.tx = cx - wx*k; S.ty = cy - wy*k; applyTransform();
  if (crossed && S.labels) renderCanvas();
}
svg.addEventListener('wheel', e => { e.preventDefault(); const r = svg.getBoundingClientRect(); zoomAt(Math.exp(-e.deltaY*0.0015), e.clientX - r.left, e.clientY - r.top); }, {passive:false});
let rsz; window.addEventListener('resize', () => { clearTimeout(rsz); rsz = setTimeout(fit, 120); });

loadData(); reindex(); renderAll();
requestAnimationFrame(fit);
})();
</script>
